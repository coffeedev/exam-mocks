45:{o:["It lets the whole report be produced in one pass, which keeps the tone consistent and avoids errors at handoffs",
"Each step is simpler and more reliable, intermediate results can be checked, and checkpoints can be added",
"It lets Claude remember the full report between sessions, so later steps can build on everything earlier",
"It removes the need for review at the end, since each step's output has already been produced separately"],
e:"Chaining makes each step simpler, lets you inspect and fix intermediate results, and allows human checkpoints between stages. It doesn't create memory between sessions, it isn't a single pass, and final review is still needed."},
46:{o:["A saved copy of last month's best status email, with a note to replace the details and keep the same structure",
"A template with role and audience, labeled placeholders, required sections, tone rules, an example output, an owner and a version",
"A prompt with role, audience, required sections and tone rules, which each account manager adapts freely for their client",
"A template with labeled placeholders and required sections, kept in each account manager's own notes for easy reuse"],
e:"A good reusable template combines clear structure, labeled placeholders, an example output and an owner and version for maintenance. A copied email has no placeholders, free adaptation loses consistency, and private copies drift apart without an owner."},
47:{o:["The approved prompts and which kinds of input data are allowed",
"Review checkpoints, who owns each one, and the escalation path",
"Guidance that reviewers can approve outputs that look correct, to keep reviews fast",
"A list of the best example outputs from the pilot, to show what Claude can produce",
"A note that each team member may adjust the prompts to suit their own working style"],
a:[0,1],
e:"An SOP records approved prompts, permitted inputs, review checkpoints with owners and escalation paths. Approving on appearance weakens review, example outputs are useful but not procedure, and individual prompt changes undo the standardization."},
48:{o:["Agree the analyst's time can be fully redeployed, and keep a manual fallback in case Claude's drafts fall short",
"Explain Claude drafts need review, state its limits, give a realistic time saving and agree success measures",
"Suggest using Claude for the data sections only, while the analyst keeps writing the commentary as before",
"Propose a three-month trial where Claude writes the report alone, after which the director decides on the role"],
e:"Honest expectation-setting covers review needs, limitations, realistic benefits and how success will be measured. Promising full redeployment overstates the benefit, an unreviewed solo trial adds risk, and a narrow split avoids the question rather than answering it."},
49:{o:["Roll the workflow out to all teams now, while the pilot team's enthusiasm is high, and gather feedback afterwards",
"Refine the workflow from pilot feedback, document it, then expand gradually with training while measuring",
"Run a second three-week pilot in the same team to confirm the results before deciding anything further",
"Share the pilot team's prompts with other teams so each can adopt the workflow at its own pace"],
e:"Pilot, refine, document, then expand gradually with training and measurement. A full rollout skips refinement, repeating the same pilot adds little new evidence, and sharing prompts without an SOP or training gives inconsistent results."},
50:{o:["The number of proposals produced per month, compared with the same month last year",
"Time per proposal against the pre-pilot baseline, alongside reviewer quality scores",
"Proposal win rate since the pilot started, compared with the team's annual target",
"Time per proposal since the pilot started, tracked weekly to show the trend over time"],
e:"Value is time saved with quality held, measured against a baseline. Volume ignores quality, win rate is affected by many factors beyond drafting, and a trend without a baseline or quality measure doesn't show improvement."},
51:{o:["After extraction only, since accurate figures make the later analysis and briefing reliable automatically",
"Before the briefing goes to clients, including a check of the extracted figures it relies on",
"After the trend analysis, since that is where Claude's interpretation is most likely to go wrong",
"On a random sample of briefings each month, since checking every one would remove the time saving"],
e:"The essential checkpoint is before anything external and irreversible, and it should cover the figures the briefing relies on. Checking only one earlier stage misses later errors, and sampling lets some unchecked briefings reach clients."},
52:{o:["Drafting a job description from the hiring manager's requirements, for review",
"Summarizing panel interview notes into a consistent format for the hiring discussion",
"Ranking shortlisted candidates so the panel only interviews Claude's top five",
"Screening CVs and rejecting those that don't meet stated criteria, with a weekly audit",
"Writing and sending personalized rejection emails to unsuccessful finalists"],
a:[0,1],
e:"Drafting and summarizing support people without making decisions. Ranking who gets interviewed, rejecting candidates (even with an audit) and sending sensitive candidate messages hand consequential steps to the tool."},
53:{o:["Make the workflow optional but share weekly time-saving figures, so resistant colleagues see the benefits",
"Involve the team in choosing tasks, share pilot evidence, train them, and keep humans in control of decisions",
"Appoint enthusiastic team members as champions who demonstrate the workflow to others",
"Run a training session on the workflow's features and make the recording available for anyone who missed it"],
e:"Adoption grows from involvement, evidence, training and clear human control together. Sharing figures, appointing champions or recording training each help, but alone they don't address why people are resistant."},
54:{o:["Add each attendee's role to the transcript header so Claude can match actions to the right person",
"Add a step where the meeting owner confirms owners and deadlines before the list goes out",
"Ask Claude to mark any owner it is unsure about with a question mark, for attendees to correct",
"Have each attendee confirm their own actions after the list is sent to everyone"],
e:"A human check at the point of error, before distribution, stops wrong assignments going out. Roles in the header or uncertainty markers help Claude but still let errors through, and confirming after sending means the wrong list is already out."},
55:{o:["Drafting the narrative commentary from approved figures, for the finance lead to edit",
"Summarizing variance explanations supplied by budget owners into a single table",
"Signing off the final budget figures as approved",
"Drafting speaker notes and likely questions for the presentation"],
e:"Sign-off is an accountable human decision. Drafting, summarizing and preparing speaker notes are good augmentation tasks, reviewed by the team."},
56:{o:["“Summarize today's call with Acme Ltd, focusing on next steps for our UK small-business customers.”",
"“Our audience is UK small-business owners. Use plain British English and end with a clear next step.”",
"“Here are this morning's sales figures. Present them in plain British English for small-business owners.”",
"“Shorten the second paragraph, keeping the plain British English style that suits small-business owners.”"],
e:"Project instructions hold stable rules that apply to every chat, such as audience and style. The other options mix those rules into a one-off task, which belongs in the chat."},
57:{o:["Add an instruction telling Claude to use whichever file has “revised” in its name when they conflict",
"Remove the outdated version, keep one clearly named current file, and review knowledge on a schedule",
"Merge the two files into one document so Claude has all the content from both versions in one place",
"Rename the files with dates so Claude can work out which version is newer when answering"],
e:"Removing the stale file fixes the root cause, and a review schedule prevents it recurring. A naming rule or dates still leave conflicting content available, and merging the files puts the contradictions into one document."},
58:{o:["Everything in the current chat that Claude can refer to, apart from its own responses",
"Everything Claude can consider at once: instructions, files, the conversation history and its own response",
"The instructions and files in a Project, plus any memory Claude has of previous chats",
"The text of the current message and any files attached to it, but not earlier messages"],
e:"The context window is the total text Claude can consider at one time, including instructions, files, history and the response it is writing."},
59:{o:["Ask Claude to summarize all 15 documents into one, then keep going in the same chat with the summary",
"Start a new chat with a summary of key decisions and only the documents relevant to the current task",
"Continue in the same chat but remind Claude which of the documents matter for the current question",
"Start a new chat and upload all 15 documents again, so the old conversation no longer takes up space"],
e:"A fresh chat with a summary and only the relevant documents keeps the context focused. Staying in the crowded chat leaves the clutter, and re-uploading everything just refills the context."},
60:{o:["Profile preferences",
"Project instructions in each Project",
"A custom style applied to each chat",
"An instruction saved as a template"],
e:"Profile preferences apply across all your chats. Project instructions only apply in that Project, and styles or templates would need applying each time."},
61:{o:["Styles",
"Profile preferences",
"A new Project with its own instructions",
"A note at the start of every chat"],
e:"Styles adjust tone and format of responses without touching Project rules. Profile preferences apply everywhere and permanently, a new Project is heavy for a temporary change, and per-chat notes must be repeated."},
62:{o:["The connector's settings in Claude, which give Claude access to everything in that calendar app, including colleagues' calendars",
"The permissions granted to the connection, within what the account can already access and what the organization allows",
"Claude's own judgment about which events are relevant, limited to the calendars shared with the associate's team",
"The organization's admin, who sets one access level for every connector regardless of which account is connected"],
e:"Connectors work within the permissions granted, the connected account's existing access and organizational controls. They don't open up everything in the app, Claude doesn't decide its own access, and access isn't one fixed level for every account."},
63:{o:["Keep both instructions and add a note saying “use your judgment to balance brevity and completeness”",
"Resolve the conflict: say which rule wins, or when each applies, such as a brief summary then a methodology appendix",
"Remove the methodology instruction, since brevity is the more common requirement for most users of the Project",
"Move the methodology instruction into a knowledge file, so it doesn't compete with the brevity rule in the instructions"],
e:"Conflicting rules need explicit resolution, either a priority or a rule about when each applies. “Use your judgment” keeps the conflict, dropping a rule loses a real need, and moving it to knowledge doesn't resolve which applies."},
64:{o:["Paste a 2-page summary into the custom instructions, and leave the full guide out so the instructions stay focused",
"Upload it as Project knowledge, and put a short summary of key rules in the instructions with a note to consult it",
"Upload it as Project knowledge with no instructions, since Claude will find and apply the relevant parts by itself",
"Paste the full guide into the custom instructions, since instructions are applied more reliably than knowledge files"],
e:"Long reference material belongs in knowledge, and the instructions hold the core rules and point to it. A summary alone loses the detail, knowledge with no instruction may not be applied consistently, and 40 pages of instructions are too long to follow well."},
65:{o:["Giving files descriptive names that include a version or date",
"Reviewing the knowledge base regularly and removing superseded files",
"Keeping superseded files but adding “OLD” to their names so Claude can tell them apart",
"Uploading the full policy library so Claude can cross-reference related documents",
"Combining related files into one large document to reduce the number of files"],
a:[0,1],
e:"Clear names and regular pruning keep the knowledge current and unambiguous. Old files marked “OLD” are still available to draw on, a full library adds noise, and one large merged file makes it harder to keep current."},
66:{o:["An employee's sick-leave dates recorded in the HR system without the reason for absence",
"A patient's name linked to their diagnosis and treatment dates",
"A list of patients' names and appointment times, with no medical details included",
"Aggregated statistics on how many patients a clinic treated for each condition last year"],
e:"PHI is health information tied to an identifiable individual. Absence dates alone aren't health information, names and times without medical details are personal data rather than PHI in this sense, and aggregated statistics don't identify anyone."},
67:{o:["The tenure, plan and usage columns plus customer ID numbers, so results can be matched back to accounts later",
"Only the tenure, plan and usage columns, with identifiers removed, after confirming policy allows it",
"The full export, uploaded to the approved workspace, since the data terms there cover personal information",
"The tenure, plan and usage columns, with names removed but emails kept so Claude can spot duplicate accounts"],
e:"Data minimization means sharing only what the task needs, with identifiers removed and policy confirmed. Customer IDs and emails are identifiers the analysis doesn't need, and an approved workspace doesn't remove the duty to minimize."},
68:{o:["A direct prompt injection, because the instruction is written directly into the page",
"An indirect prompt injection, hidden in content Claude reads",
"A hallucination, because Claude would be inventing a recommendation",
"A jailbreak attempt by the user who asked for the summary"],
e:"Instructions hidden in content Claude reads are indirect prompt injection. Direct injection is typed by the user, it isn't a hallucination, and the user asking for the summary didn't write the hidden text."},
69:{o:["Instruct Claude to ignore any instructions found inside emails, and to flag suspicious messages for review",
"Treat email as data, limit Claude's permissions to what's needed, and require approval before it sends or forwards",
"Only allow Claude to process emails from senders in the company address book, and block all external mail",
"Let Claude act on emails freely, but review its sent folder at the end of each day to catch any mistakes"],
e:"Defense in depth works best: treat content as data, apply least privilege, and require human approval for actions. Instructions to Claude can be overridden, internal senders can be compromised, and an end-of-day review is too late."},
70:{o:["Indirect prompt injection, as the request targets confidential data",
"Direct prompt injection",
"A social engineering attack on the Project owner",
"Jailbreaking through a hidden instruction"],
e:"A user typing an instruction to override the rules is direct prompt injection. Indirect injection arrives hidden in content Claude reads."},
71:{o:["Plagiarism risk, which can be managed by citing the original paper in the new document's references",
"Copyright and IP risk. Use the paper only as research input and produce original analysis",
"Quality risk, because a rewritten paper will be weaker than one written from the start",
"Confidentiality risk, because the competitor's paper may have been shared without permission"],
e:"Rewriting someone else's work to pass it off as yours is a copyright and IP problem, and a citation doesn't make a disguised copy acceptable. Quality and confidentiality aren't the main concern here."},
72:{o:["Use the free tool, but remove product names, dates and figures first, so the roadmap can't be identified",
"Use only the organization's approved AI tools, whose data terms cover confidential material",
"Use the free tool with chat history turned off, so the content isn't stored or used for training",
"Use the free tool for the wording only, pasting a section at a time so no single chat holds the full roadmap"],
e:"Confidential material belongs only in approved tools with suitable data terms. Redaction, history settings or splitting the content don't make an unapproved tool approved."},
73:{o:["Which AI tools employees may use, and how much each department can spend on them per year",
"Which tools are approved, which data may be used, prohibited uses, disclosure rules and review requirements",
"The prompts employees should use for common tasks, and the model tier for each type of task",
"Which roles may use AI, and the training each role must complete before being given access"],
e:"An acceptable use policy sets guardrails: approved tools, permitted data, prohibited uses, disclosure and review. Budgets, prompt libraries and training plans may exist alongside it but aren't what it defines."},
74:{o:["Disclose it only if the columnist's edits were minor",
"Disclose the AI assistance as the policy requires",
"Disclose it in the publication's annual report",
"Credit Claude as co-author alongside the columnist"],
e:"When policy requires disclosure, disclose. Disclosure doesn't depend on the amount of editing, an annual report isn't where readers will see it, and the human author stays accountable rather than sharing authorship with the tool."},
75:{o:["Write them as clearly labeled fiction, since satire about public figures is generally allowed",
"Decline, because deceptive political disinformation breaks Anthropic's Usage Policy",
"Write them only after checking with legal whether the claims could be defamatory",
"Decline to publish them, but write drafts in case the requester has a legitimate purpose"],
e:"Producing deceptive content meant to mislead voters is prohibited misuse. Calling it fiction doesn't change fake news articles spreading false claims, and a legal check or drafts “just in case” still create the disinformation."},
76:{o:["Upload it to the approved workspace as it is, since data terms there cover customer details",
"Redact or crop out the personal details the task doesn't need, in line with policy",
"Upload it and ask Claude to describe only the layout, so the personal data isn't used",
"Take a lower-resolution screenshot so that the names and emails are harder to read"],
e:"Remove personal details the task doesn't need before sharing. An approved workspace doesn't remove the duty to minimize, telling Claude to ignore data doesn't remove it, and blurry text may still be readable."},
77:{o:["Ranking may be inaccurate, so the bottom half should be reviewed by a person before rejection letters go out",
"Decisions about people need human accountability, bias checks and legal compliance, so Claude should support, not decide",
"Applicants may object to AI screening, so the job advert should state that AI is used to rank applications",
"Claude's ranking may be inconsistent, so the rubric should be tightened before the screening is run"],
e:"Consequential decisions about people need human ownership, fairness checks and compliance. Reviewing only the rejected half, disclosing AI use, or a tighter rubric still leave Claude effectively deciding."},
78:{o:["Using the organization's approved workspace under its agreed data terms",
"Removing or pseudonymizing identifiers that the task doesn't need",
"Telling Claude at the start of the chat that the data is confidential and must not be repeated",
"Turning off chat history so the data is not kept after the conversation ends",
"Splitting the data across several chats so no single conversation contains all of it"],
a:[0,1],
e:"Approved tools with suitable terms and minimizing identifiable data are real controls. Telling Claude the data is confidential, turning off history or splitting it across chats don't control the exposure."},
79:{o:["Remove the file from the Project themselves, then message the colleague to explain what happened",
"Ask the colleague to delete the file, and check that Claude no longer repeats the number",
"Report it through the data-incident process and have the file removed or redacted from the Project",
"Delete the chat containing the answer so the number is no longer visible to the rest of the team"],
e:"Exposed sensitive data goes through the organization's incident process, and the source must be removed. Quietly fixing it skips the process the organization needs to assess the exposure, and deleting one chat leaves the file in place."},
81:{o:["Restate the table format at the start of each new message for the rest of the chat",
"Summarize agreed decisions and format, continue in a new chat, and move the rule into Project instructions if it recurs",
"Paste an example of the correct table and ask Claude to use it for every table from now on",
"Ask Claude to reread the start of the conversation and follow the format agreed there"],
e:"This is context drift. A fresh chat with a verified summary resets the context, and a recurring rule belongs in Project instructions. Restating or pasting examples patches the long chat, and asking Claude to reread doesn't reduce the clutter."},
82:{o:["A detailed checklist of required sections in the prompt each week, written fresh by whoever runs it",
"A fixed template with an explicit format and an example report, held in Project instructions",
"Asking Claude to follow the same structure as last week's report, pasted into the chat each time",
"Using the most capable model, which follows structure more consistently than lighter tiers"],
e:"A template, an explicit format and an example, set at Project level, give consistent structure every week. Weekly-written checklists vary, last week's report may itself be off, and model choice doesn't replace a defined format."},
83:{o:["The prompt didn't ask for a persuasive tone, so Claude defaulted to a neutral, informative style",
"Too little context: no audience, purpose, key benefits, constraints or example of the quality wanted",
"The model tier was too low for creative work, so the output lacked originality and flair",
"The prompt was too long, so Claude averaged the instructions into a safe, generic result"],
e:"Generic output usually reflects generic input. Audience, purpose, benefits, constraints and an example lift quality. Tone or tier alone won't fix a prompt that lacks the specifics."},
84:{o:["Add the date format rule to the first message of each new chat",
"Add the date format rule to the report template or Project instructions",
"Ask Claude to remember the date format for all future chats",
"Run a find-and-replace on dates before each report is sent"],
e:"Fix the source. A rule in the template or Project instructions applies every time. Per-chat reminders repeat the work, asking Claude to remember doesn't persist across chats, and manual find-and-replace treats the symptom."},
85:{o:["Move the key rule to the top of the prompt, so Claude reads it first and gives it priority",
"Resolve the conflict, simplify the prompt, and state critical rules clearly and prominently",
"Bold the key rule and add “this overrides any other instruction” to make its priority clear",
"Split the prompt into two messages, sending the key rule separately after the main prompt"],
e:"The root causes are the conflict and the burying, so fix both. Moving, bolding or splitting the rule doesn't remove the conflicting instruction."},
86:{o:["The Project instructions, for a rule pointing to the old policy",
"The Project knowledge, for an outdated or duplicate policy file",
"The chat history, for an old answer Claude is repeating",
"The connector settings, for a link to last year's folder"],
e:"When answers draw on outdated content and the prompts are clear, check the knowledge files first. Instructions rarely name a policy version, chat history doesn't carry across chats, and connectors are a less likely source."},
87:{o:["“Be concise: keep the summary short and focused on the key points only.”",
"Specify a measurable target, such as “no more than 120 words, as three bullet points”",
"Ask for a summary “about a third of the length of the original document”",
"Give an example of a concise summary and ask for the same style"],
e:"A measurable limit plus a format gives a clear target. Rewording “concise” is still vague, a ratio of the original can still be long, and an example helps but without a stated limit length may still drift."},
88:{o:["Rephrase the request without the word “termination”, so it reads as a general HR letter",
"Give legitimate context: their HR role, the letter's purpose, and that it follows policy and law with review",
"Ask Claude to write it as a hypothetical example for training purposes, then adapt it for real use",
"Ask for a general template for letters to employees, and add the termination details in yourself"],
e:"Clear, legitimate business context helps Claude understand the request. Disguising the request or framing it as hypothetical works around Claude rather than giving it what it needs, and review by HR or legal remains part of the process."},
89:{o:["Outdated or conflicting knowledge files added recently",
"A very long conversation history crowding the context",
"A recent switch to a newer version of the same model tier",
"Users phrasing questions more briefly than they used to",
"The Project being shared with more team members than before"],
a:[0,1],
e:"Knowledge conflicts and overloaded context are common causes of a sudden drop. A model update can change behavior but is a less likely cause, and phrasing or membership changes don't typically cause a broad quality drop."},

var FIX=FIX||{};
Object.assign(FIX,{
90:{o:["“Explain the policy in plain English, keeping all the detail of the original so nothing important is lost.”",
"“The audience is warehouse staff, many with English as a second language. Use short sentences, everyday words, one example per rule.”",
"“Translate the policy into the three most common first languages among warehouse staff, and keep the English version too.”",
"“Rewrite the policy as a one-page summary with headings, so warehouse staff can find the rule they need quickly.”"],
e:"Naming the audience and their language needs lets Claude pitch vocabulary, sentence length and examples correctly. Keeping full detail works against comprehension, translation wasn't asked for and needs checking, and a summary with headings doesn't address the language barrier."},
91:{o:["“Suggest five strong names for an internal newsletter at a 300-person engineering firm, and pick the one you think is best.”",
"“Generate 15 varied name ideas for an internal newsletter for a 300-person engineering firm, mixing playful and plain, with a rationale each.”",
"“Generate 15 name ideas for our internal newsletter. Make them catchy and memorable, and avoid anything too corporate.”",
"“Give me the single best name for an internal newsletter at an engineering firm, with a short explanation of why it works.”"],
e:"Early idea generation works best with many varied options plus enough context to make them relevant. Five ideas with a pick, or one “best” name, narrows too soon, and 15 ideas without context about the firm are less relevant."},
92:{o:["Ask for the full guide in one go, then review it section by section and request fixes",
"Ask for an outline with section goals, agree it, then draft section by section",
"Draft the introduction first, agree its tone, then ask Claude to write the remaining sections",
"Give Claude a similar guide from another team and ask it to produce one in the same structure"],
e:"Agreeing the outline first catches structural problems cheaply, and drafting by section keeps each part reviewable. A full draft is harder to steer, agreeing only the introduction leaves the structure open, and another team's guide may not fit."},
93:{o:["“Check every figure against the uploaded report and correct any that differ from it.”",
"“Label each figure with its source, the report (with page) or general knowledge, and flag the latter for checking.”",
"“Rewrite the overview using only figures from the uploaded report, and remove anything from general knowledge.”",
"“Add a sources section at the end listing the uploaded report and any other sources you drew on.”"],
e:"Attributing each figure separates grounded content from recall and shows exactly what to verify. Self-correction isn't verification, removing general knowledge may drop useful context, and a sources list at the end doesn't say which figure came from where."},
94:{o:["Number the three tasks clearly so Claude handles each one in turn within the same response",
"Split the unrelated tasks into separate, focused requests",
"Put the most important task first and the least important last, so it gets the most attention",
"Add a heading for each task and ask Claude to give equal effort and detail to all three"],
e:"Unrelated tasks compete for attention and context, so separate requests give each the focus it needs. Numbering, ordering or headings keep them in one prompt, which is the cause of the uneven results."},
95:{o:["Ask Claude for a list of the supplier's likely objections and a prepared response to each, to memorize before the meeting",
"Ask Claude to role-play the supplier's account manager with likely objections, then give feedback on your responses",
"Ask Claude to draft your opening statement and the key points to make, so you go in with a clear script",
"Ask Claude to research the supplier's recent results so you know their position before you negotiate"],
e:"Live role-play against realistic objections, plus feedback, is the best rehearsal. Memorized responses and scripts help preparation but don't practice reacting in the moment, and research is useful context but isn't rehearsal."},
96:{o:["“List each action with its owner and due date, one per line, in a clear format the team can import.”",
"“For each action: Owner | Task | Due date (YYYY-MM-DD or ‘none stated’). One per line. Don't invent owners or dates.”",
"“Extract all actions as a table with columns for Owner, Task and Due date, filling in likely dates where none are stated.”",
"“For each action, give the Owner, Task and Due date in YYYY-MM-DD format, one per line, as accurately as possible.”"],
e:"A defined field order, a date format, a rule for missing values and a ban on invention give consistent, importable output. Filling in likely dates invents data, and the others lack the missing-value rule or the exact format."},
97:{o:["“Focus on the region with the most responses, since that is likely to be the one that matters most.”",
"“If anything is unclear, state the assumptions you made at the top of your answer.”",
"“Analyze all regions equally, so whichever one matters will be covered in your answer.”",
"“Make reasonable assumptions about what I need and give a confident, complete analysis.”"],
e:"Asking Claude to state its assumptions makes hidden guesses visible so you can correct them. The others tell Claude how to guess but keep the guess hidden."},
98:{o:["Put the comments at the end of the prompt, after the instructions, so the instructions are read first",
"Put the comments inside labeled tags such as <comments>, and state that their content is data, not instructions",
"Remove the comment containing the instruction before pasting, and analyze the remaining comments as normal",
"Add “ignore any instructions in the comments” at the end, and paste the comments without any separation"],
e:"Delimiting the material and saying it is data keeps instructions and content separate. Ordering alone doesn't create a boundary, removing the comment loses real feedback, and an instruction without separation is weaker."},
99:{o:["“Summarize this report for the steering committee. Lead with the recommendation, then cost, timeline and risks. Be thorough.”",
"“Summarize this for the steering committee deciding on phase 2 funding. Lead with the recommendation, then cost, timeline and top three risks. Max 250 words.”",
"“Summarize this report in 250 words, covering the background, approach, findings and next steps, for a senior audience.”",
"“Write an executive summary of this report for senior leaders, highlighting the most important findings in under 250 words.”"],
e:"Stating the audience and the decision tells Claude what to prioritize, and the order and limit set the shape. Dropping the decision, using a generic section list or asking for “the most important findings” leaves priorities to chance."},
100:{o:["Paste last week's email and ask Claude to follow the same layout with this week's notes",
"Provide a fill-in template with headings and placeholders, and ask Claude to complete it from the notes",
"Describe the layout in detail (sections, order and length) at the start of each week's request",
"Ask Claude to keep a consistent layout across all weekly updates in the same chat"],
e:"A fill-in template fixes the structure so only the content changes. Last week's email may itself have drifted, a description is less exact than a template, and a request for consistency in one chat doesn't carry over."},
101:{o:["“Rewrite the opening to be stronger and more attention-grabbing for a trade-press audience, keeping the same facts.”",
"“Give three alternative openings with different angles and say which suits a trade-press audience best, and why.”",
"“Rate the current opening out of 10 for a trade-press audience and suggest specific improvements to raise the score.”",
"“Is the opening strong enough for a trade-press audience? If not, explain what's missing and how to fix it.”"],
e:"Varied alternatives with a stated audience give real options to compare. A single rewrite gives one option, a score is arbitrary, and a yes or no question with fixes gives less to choose from."},
102:{o:["“Rewrite in a warm, plain tone, keeping the meaning the same and the length roughly similar.”",
"“Rewrite in a warm, plain tone. Keep every rule, number and deadline exactly, and add no new commitments.”",
"“Rewrite in a warm, plain tone and highlight any rules you changed so I can check them afterwards.”",
"“Rewrite in a warm, plain tone, simplifying rules where possible so they are easier to follow.”"],
e:"Explicitly protecting rules, numbers and deadlines, and forbidding new commitments, keeps the substance intact. “Keep the meaning” is too loose, highlighting changes still allows them, and simplifying rules changes them."},
103:{o:["Upload the full project folder at the start, so Claude has every detail available when it's needed",
"Give a concise project brief at the start (goals, audience, constraints, key terms), updated if things change",
"Explain the project in detail in the first message, and refer back to that message when needed",
"Give Claude the background in short pieces as each task comes up, so only relevant detail is used"],
e:"A concise brief up front gives stable context for every request, and updating it keeps it accurate. A full folder adds noise, a long first message gets buried in a long session, and drip-feeding makes context inconsistent."},
104:{o:["It doesn't give Claude the report's audience, so Claude can't judge the right style or tone",
"“Better” is undefined. Claude must guess whether that means shorter, clearer, more persuasive or more detailed",
"It doesn't say how long the improved report should be, so Claude may make it much longer",
"It asks Claude to rewrite the whole report when only parts of it probably need changing"],
e:"The core problem is undefined success criteria. Audience, length and scope matter too, but they're all parts of saying what “better” means."},
105:{o:["An example of one well-written FAQ entry in the house style",
"The intended audience and the questions customers ask most often",
"A request to cover every feature in the documentation, each with its own FAQ entry",
"A request to write the answers in a persuasive, sales-focused tone to promote upgrades",
"An instruction to answer from general product knowledge where the documentation is unclear"],
a:[0,1],
e:"An example sets the style, and the audience plus real customer questions set the content. Covering every feature ignores what customers ask, a sales tone doesn't fit an FAQ, and general knowledge invites inaccurate answers."},
106:{o:["Stating the business question the analysis must answer",
"Asking Claude to show how it calculated key figures",
"Asking Claude to find all the interesting patterns in the data",
"Sharing your expected result so Claude can test whether it holds",
"Asking for the conclusions first so you can decide what to explore"],
a:[0,1],
e:"A clear business question focuses the analysis, and visible calculations make it checkable. Open-ended pattern hunting lacks focus, sharing an expected result invites confirmation, and conclusions without method can't be checked."},
107:{o:["“Summarize the research on four-day weeks and tell me whether it would work for our support team.”",
"“Give the strongest arguments for and against a four-day week for a 25-person support team, with evidence to look for.”",

112:{o:["Claude may have used an old version of the policy, so the policy document should be added to the chat",

115:{o:["That Claude has more up-to-date information than the associate about the competitors",

118:{o:["Ask Claude to rate the overall sentiment of the comments, and compare it with the tone of the summary",

124:{o:["Vagueness. “Next year” doesn't say which month, so readers can't plan around it",

170:{o:["Replace the old version straight away, since the new one fixes known problems",

"Test it on one sample task, then replace the old version if the output looks good"],

175:{o:["Deciding which internal team meeting to cancel this week",

176:{o:["Have Claude produce a ranked shortlist of ideas before the workshop, for the team to discuss",

177:{o:["Ask the expert to write down everything they know, then have Claude turn it into a polished manual",

184:{o:["Approving standard discounts under 5% for existing customers, to save managers' time",

185:{o:["Add a short guide explaining how to read the outputs, and send it with each delivery",

186:{o:["“Escalate any complaint that seems serious to a team lead, using your judgment about what counts as serious.”",

187:{o:["Every version of each policy, so Claude can see how the rules have changed over time",

188:{o:["Lock the instructions so no one can change them, and review them once a year",

189:{o:["Upload the full manual to a Project, so Claude can find the relevant chapter itself",

190:{o:["Start a new chat outside the Project, so the new work isn't mixed up with the client's material",

191:{o:["Add a short priority list at the top, so Claude knows which of the five pages matter most",

192:{o:["Connect the full drive, since the finance folder may link to files stored elsewhere",

193:{o:["One Project per industry, so clients in the same sector share useful background",

194:{o:["Upload the new policy alongside the old one, with a note in the instructions saying which is current",

195:{o:["Ask Claude to summarize the new instructions and check the summary matches what was intended",

196:{o:["“For the Q3 board pack, write in a formal tone and put key numbers first in every section.”",

197:{o:["A Project with samples of their writing as knowledge",

"Profile preferences describing how they like to write",

e:"Styles are designed to adjust how Claude writes, and a custom style can be built from writing samples. A Project only applies inside it, preferences describe you rather than capture a writing style, and templates need reusing each time."},
198:{o:["Both through connectors, so Claude always reads the latest version of each document",

199:{o:["“Travel Policy (latest).pdf”, “Expense Policy (current).pdf”",

200:{o:["Claude's attention is limited per message, so long questions late in a chat get less careful answers",

203:{o:["Claude may draw on outdated or irrelevant material",

205:{o:["Yes, in the approved workspace, since its data terms protect confidential material from any client",

206:{o:["It risks damaging trust if customers find out, so it should be labeled as AI-generated before sending",

207:{o:["Whether the photographer is credited correctly in the campaign materials",

208:{o:["Using the approved workspace, removing the company names but including the deal terms for analysis",

210:{o:["Claude's assessments may be inconsistent, so the bank should average several assessments per application",

220:{o:["Use the approved workspace and remove surnames, which is enough for most education data",

221:{o:["A clear, modern design with consistent fonts and colors, and short modules",

e:"Batching keeps each request manageable, and identical instructions keep results comparable. Self-review isn't reliable, a bigger model doesn't remove the length effect, and reversing just moves the problem."},
232:{o:["The contract may be too long. Upload only the pages with the key clauses",
"The scan may be unreadable. Upload a clearer scan or a text-based version",
"Claude may need clause numbers. Tell it which numbered clauses to look for",
"Images use more context. Turn on extended thinking to read the scan better"],
e:"Poor scan quality prevents accurate reading, so a clearer or text-based file fixes the root cause. Splitting pages or giving clause numbers doesn't help if the text can't be read, and extended thinking doesn't fix image quality."},
233:{o:["Rephrase the questions to mention the policy document by name each time",
"Confirm the document uploaded properly, then tell Claude to answer only from it and quote the section",
"Upload the policy again with a clearer file name, such as “OFFICIAL-POLICY.pdf”",
"Ask Claude to compare its general knowledge with the policy and note any differences"],
e:"First confirm the source is available, then make grounding explicit with quotes. Mentioning or renaming the file doesn't enforce grounding, and comparing with general knowledge still uses it."},
234:{o:["Run each version on a different set of similar documents, then compare average quality",
"Run both versions on the same documents and compare the outputs against the same criteria",
"Run each version several times on one document and pick the one with the best single output",
"Ask Claude which version of the prompt is better written, and use its recommendation"],
e:"A fair test holds the input constant and uses the same criteria. Different documents add noise, best single outputs reward luck, and Claude's view of the prompt text isn't a test of results."},
235:{o:["Save the explanation as a text file and paste it at the start of each new chat",
"Put the stable information in Project instructions or profile preferences",
"Keep one long-running chat so the explanation only needs to be given once",
"Ask Claude to remember the explanation for future chats at the end of each session"],
e:"Repeated setup belongs in persistent configuration that applies automatically. Pasting still repeats the work, one long chat drifts, and asking Claude to remember doesn't persist across chats."},
236:{o:["Keep the most capable model but send the addresses in larger batches to cut the number of requests",
"Move this simple, high-volume task to a faster, lower-cost model and check a sample",
"Switch to the balanced tier, since it is the recommended default for most business tasks",
"Keep the most capable model for accuracy, but run the job overnight so speed doesn't matter"],
e:"Simple bulk work suits the fastest, cheapest tier, with a sample check. Bigger batches and overnight runs keep the cost, and the balanced tier is still more than this task needs."},
237:{o:["Add “use a casual, friendly tone” to the start of each message in the channel",
"Give an example of the desired tone and set it in Project instructions or a style",
"Ask Claude to rewrite each answer more casually after it gives the first version",
"Switch to the fastest model tier, which tends to write in a less formal style"],
e:"A tone example set at the configuration level fixes it for every response. Per-message instructions and rewrites repeat the work, and model tier isn't a reliable tone control."},
238:{o:["Ask Claude to summarize the report again, focusing on the risks section this time",
"Check the risk is clearly in the source and whether the prompt asked for risks, then adjust the prompt",
"Ask Claude why it left the risk out, and add the risk to the summary yourself",
"Switch to a more capable model tier, since it is more likely to catch important risks"],
e:"Trace the root cause: was the information in the source, and did the prompt ask for it? Then fix the prompt. Re-running, asking why or switching tier skips the diagnosis."},
239:{o:["Start a separate chat for each client",
"Clearly label each client's material, for example with tags, when both must be in one request",
"Ask Claude to summarize each client's details at the top of each reply to keep them straight",
"Keep both clients in one chat but alternate between them less often",
"Move both clients into one Project so Claude has a clearer view of each"],
a:[0,1],
e:"Separate chats isolate the contexts, and labels keep material distinct when it must be combined. Summaries in each reply, alternating less or a shared Project don't separate the material."},
240:{o:["A stricter word limit so the draft has to focus on the essentials only",
"Client specifics: their stated priorities, past objections and own phrases",
"A more senior role, such as “act as a managing partner pitching this client”",
"An instruction to “avoid sounding generic or templated in any section”"],
e:"Generic output comes from generic input. Client-specific detail gives Claude something distinctive to work with. A senior role or an instruction to avoid sounding generic changes the label, not the material, and a tighter word limit doesn't add specificity."},
241:{o:["Move the brief's key question to the very start, before the brief and the reports",
"Put the reports first in tagged sections, then the brief and the question last",
"Split the brief into short bullet points but keep it above the three reports",
"Repeat the key question once above and once below each of the three reports"],
e:"With long inputs, placing the documents first and the question last, with tags separating them, tends to give the best results. Moving the question to the top leaves it far from the end of the context. Repeating it after every report adds clutter."},
242:{o:["Add an instruction: “Only apologize when something went wrong for the customer.”",
"Replace one of the three examples with a good-news reply and keep the other two",
"Use varied examples (apology, good news, neutral update) and name the shared tone",
"Remove all the examples and describe the tone in words, with a list of key traits"],
e:"Examples teach whatever they share. Varying the situations while naming the common feature (tone) isolates what to copy. A rule can help, but it fights the pattern in the examples. Swapping one example only partly fixes the imbalance, and dropping examples loses the style signal."},
243:{o:["Asking for three alternative versions with different tones to choose from",
"The relationship history and what the company wants to keep, such as goodwill",
"Specifying a word limit of around 200 words and a warm but firm tone",
"Asking Claude to adopt the persona of an experienced procurement director"],
e:"In a sensitive message, the purpose and relationship context determine tone and content. Alternatives, length limits and personas all help at the margin, but without the context every version will miss the point."},
244:{o:["Remove “be concise”, because the audit file's need for detail takes priority",
"Say which part is concise and which is complete, such as a short summary then full detail",
"Ask Claude to find the right balance between conciseness and completeness",
"Add a hard limit of 300 words to the whole response, including all details"],
e:"The two instructions conflict. Assigning each to a different part of the output satisfies both needs. Dropping one loses a real requirement, “balance” is still vague, and a hard cap may cut details the audit needs."},
245:{o:["Ask for a recommendation followed by a detailed one-paragraph justification",
"Give the weighted criteria, have Claude score each option, then recommend",
"Ask Claude to think step by step and present only the final recommendation",
"Ask for a full pros and cons list for each location without a recommendation"],
e:"Explicit, weighted criteria with visible scoring make the reasoning auditable and tie it to what the committee cares about. A paragraph justification is harder to check, hidden reasoning can't be audited, and pros and cons alone don't answer the question."},
247:{o:["2 → 4 → 3 → 1 → 5",
"4 → 2 → 3 → 1 → 5",
"2 → 4 → 1 → 3 → 5",
"2 → 4 → 3 → 5 → 1"],
e:"Define the purpose first so extraction targets the right facts, verify the facts before drafting on top of them, and polish tone last. Verifying after drafting means errors are already embedded, and extracting before defining the purpose wastes effort."},
248:{o:["An accuracy failure, because leaving out the finding misrepresents the audit's overall result",
"A completeness failure, and a serious one given the finding's severity",
"A relevance failure, because the summary focused on lower-priority topics instead of the key risks",
"Not a failure, because a summary is expected to leave out detail and every stated point is correct"],
e:"Nothing stated is wrong, so accuracy holds. The summary leaves out something material, which is a completeness failure, made serious by the risk rating. Summaries do omit detail, but not high-risk findings."},
249:{o:["Check the first ten claims thoroughly, since the opening claims frame how the rest is read",
"Check the claims the recommendation depends on, plus any precise figures or quotes",
"Ask Claude to verify all 30 claims against sources and flag any it is unsure about",
"Skim all 30 claims quickly for anything implausible, then check those in more depth"],
e:"Risk-based verification puts limited time on the claims that drive the decision and the ones most likely to be invented. Position in the document isn't a risk signal, self-verification isn't independent, and skimming for plausibility misses confident errors."},
250:{o:["Keep the citation and add the correct year and region in brackets after the statistic",
"Correct the claim to match the source, or find a source that supports the original",
"Remove the citation but keep the statistic, since it is broadly in line with the source",
"Ask Claude to find a better citation for the same statistic, then use the new one"],
e:"The citation exists but doesn't support the claim as written, so the claim changes to match the evidence or new evidence is found. Brackets leave a wrong claim in place, and a new citation from Claude needs checking too."},
251:{o:["Reviewing only the lowest-rated applications still takes too long to save the team real time",
"Errors among high-rated applications go unchecked, and rating bias shapes who gets reviewed",
"The rubric is probably too detailed for Claude to apply consistently across 40 applications",
"Low-rated applications are the least likely to be hired, so reviewing them adds little value"],
e:"Reviewing only one end lets errors at the other end through, and the AI's ratings decide what humans see, so systematic bias is never caught. Sampling across the whole range is a better check."},
252:{o:["The summary can be treated as checked for internal use, since Claude has reviewed it carefully",
"Claude's review may catch some issues, but “no errors” isn't independent verification",
"Claude's review is worthless, because models cannot detect errors in their own type of output",
"The summary should be regenerated in a new chat, since a second version will expose any errors"],
e:"Self-review is a useful first pass, but a clean result isn't proof. High-stakes figures need independent checks against the source. Calling it worthless overstates the point, and regenerating isn't verification."},
253:{o:["A tone problem: the rewrite is too reassuring, which a tone instruction can fix",
"A factual distortion that changes how serious the incident appears",
"A readability problem, because “brief” is vague and should be more specific",
"An acceptable simplification, since customers don't need the technical timeline"],
e:"Adapting for an audience must not change facts. Calling a six-hour outage “brief” misleads customers. It isn't just tone or vagueness, and it isn't an acceptable simplification."},
254:{o:["Draft A as it is, because clarity matters most for staff using it day to day",
"Draft B as it is, because completeness matters most when staff make decisions",
"Draft A, revised to include the two exceptions",
"Ask Claude which draft is better and use whichever one it recommends"],
e:"The best result combines A's clarity with B's completeness, since leaving out exceptions could cause wrong decisions. Choosing either as it is gives up one requirement, and deferring to Claude doesn't apply the criteria."},
255:{o:["Accept it, since the narrative explicitly says the feedback is balanced",
"Compare the positive-to-negative ratio in the source with the summary's",
"Ask Claude to add one negative quote so the summary reads as balanced",
"Remove all quotes from the summary so it reads as neutral and factual"],
e:"Checking representation against the source shows whether the summary is skewed. Adding one token quote, or removing quotes altogether, hides the problem instead of measuring it."},
256:{o:["As acceptable background, since staffing shortages commonly affect regional sales",
"As an unsupported causal claim to remove, or to reword as a hypothesis",
"As accurate, because Claude would only include it if it were likely to be true",
"As a minor style issue, since the rest of the analysis is correct and useful"],
e:"The claim goes beyond the data provided and asserts a cause. It should be removed or presented as a hypothesis. Plausibility isn't evidence."},
257:{o:["Translate it back into English with Claude and compare the result with the original contract",
"Have a qualified legal translator review the French text",
"Run it through a second AI translation tool and compare the two French versions line by line",
"Ask Claude to flag every sentence where it was uncertain, and have those checked by a speaker"],
e:"A binding legal text needs qualified human review. Back-translation and a second tool catch some errors but share the same blind spots, and self-flagging isn't reliable assurance."},
258:{o:["It promises a delivery date that operations hasn't confirmed",
"It summarizes the customer's complaint in a way that changes its meaning",
"It doesn't use the customer's account number in the opening line, as the template suggests",
"It is written in a slightly more formal tone than the team usually uses for this customer",
"It thanks the customer for their patience, which the team's guide says to avoid overusing"],
a:[0,1],
e:"An unconfirmed commitment and a distorted account of the complaint are substantive problems. Template details, a slightly formal tone and a style-guide point are minor and can be fixed in passing."},
259:{o:["Reconciling every figure against the finance system before release",
"Approval by a named, accountable person before the update is sent",
"Asking Claude to cross-check each figure against last month's update for consistency",
"Having two colleagues read each update and agree that it reads well before release",
"Running each update through a second AI tool to catch any errors the first one made"],
a:[0,1],
e:"Independent reconciliation and accountable sign-off are the core controls for external financial updates. Month-on-month checks by Claude, readability reviews and a second AI tool don't verify figures against the source."},
260:{o:["The answer can be used, since the content is correct and the source section doesn't matter",
"The answer is right by coincidence. The reasoning is flawed, so check the employee section",
"The policy must contain an error, since contractor and employee rules shouldn't overlap",
"Claude should be told never to use the contractor section when answering any question"],
e:"An answer based on the wrong source is unreliable even when it matches. It may not hold next time. Check it against the right section. Banning the contractor section would break legitimate contractor questions."},
261:{o:["Use the most capable tier for all invoices, since mistakes on unusual terms are costly",
"Use a fast, low-cost tier for all invoices and review a random sample each month",
"Fast tier for standard invoices, a capable tier plus human review for unusual ones",
"Use a mid-tier model for everything as a compromise between cost and accuracy"],
e:"Routing by complexity matches cost to need: cheap and fast for the routine bulk, more capability and human review where interpretation matters. A single tier either overspends or under-serves the hard cases."},
262:{o:["Paste the totals from each tab into the chat and ask Claude to compare them",
"Upload the file and have Claude calculate the overruns with its analysis tools",
"Ask Claude to read through each tab of the spreadsheet and estimate which projects overran most",
"Turn on extended thinking and ask Claude to work it out from a description of the file's contents"],
e:"Calculating directly from the file with analysis tools gives exact, checkable results. Manual pasting risks transcription errors, estimates aren't exact, and extended thinking can't replace the data."},
263:{o:["Ask a capable model without tools, since workplace AI regulation is well covered in its training data",
"Use research to gather and cite current sources, then verify the key citations",
"Use web search one country at a time, and skip verification since the sources are official sites",
"Upload last year's comparative report and ask Claude to bring it up to date from what it knows"],
e:"Recent, multi-source, cited work is what research capabilities are for, and the key citations still need checking. Training data may be out of date, official sources can still be misread, and “updating from memory” invites invention."},
264:{o:["A Team plan covers everything they need, including SSO for all 60 people",
"Only Enterprise can provide shared Projects and central billing at this size",
"Check current Team and Enterprise feature lists for SSO, which may decide the plan",
"Any paid plan includes SSO, so the cheapest plan with shared Projects will do"],
e:"Shared Projects and central billing are Team-level features, but SSO is the deciding requirement here. Check the current feature lists for which plans include it rather than assuming. Plan features change, so the official comparison is the source of truth."},
265:{o:["Turn it on, because keeping the key search terms within the limit requires reasoning",
"Leave it off first and check results, turning it on only if reasoning errors appear",
"Turn it on, because 50 items is a large enough batch to justify the extra time",
"Leave it off, because extended thinking cannot count characters or follow limits"],
e:"The task is moderately constrained but mostly mechanical. Start without the extra latency and add it only if results show it's needed. Volume alone isn't a reason, and nothing stops extended thinking handling limits."},
266:{o:["A two-page client brief that colleagues will edit and reuse",
"An interactive checklist the team will use every month",
"A detailed answer explaining how net promoter score is calculated, with an example",
"A list of ten suggested agenda items for tomorrow's team meeting",
"A paragraph summarizing the key points from a colleague's long email"],
a:[0,1],
e:"Artifacts suit substantial, standalone content that will be edited, reused or used interactively. Explanations, quick agenda lists and email summaries are one-off answers that belong inline."},
267:{o:["Each staff member uploads the current manual into their own chats whenever they need it",
"A shared Project with the current manual as knowledge, and an owner who replaces it quarterly",
"A shared Project with the full manual pasted into its custom instructions for reliable use",
"A shared Project with all past editions of the manual, so staff can see what has changed"],
e:"A shared Project with the manual as knowledge gives everyone the same current source, and a named owner keeps it updated. Individual uploads drift, instructions aren't meant for large references, and past editions create conflicts."},
268:{o:["Drafting the final version of contract terms for lawyers to approve without changes",
"First-pass extraction of key clauses into a summary table for lawyers to check",
"Negotiating routine amendments with counterparties by email, copying in a lawyer",
"Triaging which contracts need legal review, with lawyers checking a monthly sample"],
e:"First-pass extraction saves lawyer time on a high-volume, checkable task, while lawyers keep judgment and sign-off. The other options hand accountable decisions or external actions to the tool, even with partial oversight."},
269:{o:["Declare success, since drafting time fell sharply and review time can be cut with practice",
"End the pilot, since doubled review time cancels out most of the drafting time saved",
"Measure end-to-end time and quality, find the common corrections, and fix inputs first",
"Remove the review step for routine sections, to recover the time lost to corrections"],
e:"Judge the workflow end to end, not one stage. Analyzing the corrections shows whether better inputs or templates can cut review time. Declaring success or ending the pilot early both ignore half the evidence, and removing review adds risk."},
