"Connect more systems",
"Share the connectors with colleagues"],a:1,
e:"Removing access that isn't needed reduces risk, which is least privilege applied over time."},

{n:1,d:"c",q:"A Project's owner replaces the pricing file in its knowledge. What else should they do?",
o:["Nothing more",
"Tell the Project's users what changed and when it takes effect",
"Delete all chats in the Project",
"Rename the Project"],a:1,
e:"Users relying on the Project need to know when the knowledge they depend on has changed."},

{n:1,d:"c",q:"A team's shared Project will contain a file with salary data that only managers should see. What is the BEST approach?",
o:["Upload it to the shared Project, since members are colleagues",
"Keep the file out of the shared Project, or use a separate Project restricted to the people allowed to see it",
"Upload it with a note asking non-managers not to look",
"Rename the file to something vague"],a:1,
e:"Everyone in a shared Project can draw on its knowledge. Sensitive files need a restricted space, not a request to look away."},

{n:1,d:"c",q:"A status report must reflect a shared spreadsheet that changes several times a day. Which is the BEST setup?",
o:["Upload a copy of the spreadsheet once a week",
"Use an approved connector so Claude reads the live spreadsheet",
"Type the figures into the chat from memory",
"Paste a screenshot each morning"],a:1,
e:"For frequently changing sources, a connector gives Claude the current version without manual re-uploads."},

{n:1,h:1,d:"c",q:"A Project's instructions say “use the attached price list,” but the knowledge contains both the 2025 and 2026 lists. Sales reps report old prices. What is the BEST fix?",
o:["Add “use the most recent list” to the instructions",
"Remove the 2025 list from knowledge, and name the current file explicitly in the instructions",
"Ask reps to double-check prices themselves",
"Upload the 2026 list a second time"],a:1,
e:"Removing the stale file eliminates the conflict, and naming the current source removes ambiguity. A vague rule still leaves the old file available."},

// ---------- Governance (9) ----------
{n:1,d:"g",q:"Customer data was approved for use in analyzing service quality. A colleague now wants to use the same data with Claude to target marketing offers. What is the issue?",
o:["None, since it is the same data",
"Approval for one purpose doesn't cover a new purpose. The new use needs its own check against policy and consent",
"Only the file format",
"Marketing use is always allowed"],a:1,
e:"Purpose limitation: data approved for one use can't be assumed approved for another."},

{n:1,d:"g",q:"An associate thinks using an incognito or temporary chat makes it acceptable to paste regulated customer data into Claude. Is this correct?",
o:["Yes, temporary chats remove all data obligations",
"No. Whether regulated data can be used depends on policy and the approved workspace, not on the chat mode",
"Yes, if the chat is deleted within an hour",
"Yes, for small amounts of data"],a:1,
e:"Chat mode doesn't change data-handling obligations. Policy and approved tools decide what may be shared."},

{n:1,d:"g",q:"A consultant used Claude to prepare a deliverable for a client. What should they check before delivering it?",
o:["Only spelling",
"Their firm's AI policy and the client's terms on AI use, including any disclosure requirements",
"Whether the client uses Claude too",
"Nothing, since the work is finished"],a:1,
e:"Firm policy and client contracts may restrict or require disclosure of AI use in deliverables."},

{n:1,d:"g",q:"An AI tool is set up to take actions on its own, such as deleting records or sending payments. What control is MOST important?",
o:["Faster processing",
"Human approval before irreversible or high-impact actions",
"A longer instruction prompt",
"Running it only at night"],a:1,
e:"Irreversible actions need human oversight. Errors or manipulation can't be undone afterwards."},

{n:1,d:"g",q:"The company-approved Claude workspace is slower to access than a personal account. An associate has an urgent deadline. What should they do?",
o:["Use the personal account just this once",
"Use the approved workspace, since the policy still applies under time pressure",
"Ask a colleague to use their personal account",
"Skip AI and copy last year's work"],a:1,
e:"Policy doesn't lapse under deadline pressure. Convenience isn't a reason to move data into unapproved tools."},

{n:1,d:"g",q:"Which use of Claude in recruitment is LEAST appropriate?",
o:["Drafting a job description for the hiring manager to review",
"Summarizing interview notes for the panel",
"Automatically rejecting applicants based on Claude's screening, with no human review",
"Drafting interview questions aligned to the role"],a:2,
e:"Automatic rejection without human review removes accountability and risks unfair, unlawful decisions."},

{n:1,d:"g",q:"How should the level of human review for Claude outputs be decided?",
o:["The same level for every output",
"In proportion to risk: lighter for low-stakes internal drafts, thorough for external, regulated or high-impact content",
"Only when someone complains",
"By how long the output is"],a:1,
e:"Review effort should match the stakes and consequences of an error."},

{n:1,d:"g",q:"Which statement about how Claude generates text is MOST accurate?",
o:["It looks up verified answers in a database",
"It predicts likely text based on patterns learned in training, which is why it can produce fluent but incorrect statements",
"It only repeats sentences it has seen before",
"It always knows when it is wrong"],a:1,
e:"Prediction-based generation explains why fluent output can still be wrong, and why verification matters."},

{n:1,h:1,multi:2,d:"g",q:"An associate wants to use customer survey responses with Claude. Which TWO steps BEST reflect consent and data-minimization principles? (Select TWO.)",
o:["Confirm the survey's consent terms cover this kind of analysis",
"Remove names and contact details not needed for the analysis",
"Add purchase history to enrich the analysis",
"Use the data first and check consent later",
"Share the full export so nothing is missed"],a:[0,1],
e:"Checking consent and stripping unneeded identifiers are the core steps. Adding data or checking later works against both principles."},

// ---------- Troubleshooting (6) ----------
{n:1,d:"t",q:"A one-line prompt, “Sort these tickets,” gives inconsistent results. What is the BEST fix?",
o:["Repeat the prompt until it works",
"Specify the categories, the criteria for each, and the output format",
"Use a longer one-line prompt",
"Switch to a different chat"],a:1,
e:"Defining the categories, criteria and format removes the ambiguity behind inconsistent results."},

{n:1,d:"t",q:"A Project assistant should say when its source documents don't cover a question, but it guesses instead. What should the associate change and test?",
o:["Nothing, since guessing is helpful",
"Add an instruction to say clearly when the sources don't answer, then test with deliberately out-of-scope questions",
"Upload more documents",
"Ask users not to ask unusual questions"],a:1,
e:"An explicit fallback instruction, tested with out-of-scope questions, confirms the assistant admits gaps rather than guessing."},

{n:1,d:"t",q:"A format rule is buried in paragraph six of a long prompt, and Claude ignores it. What is the BEST fix?",
o:["Repeat the paragraph",
"Move the format rules into a short, clear list near the end of the request, with an example of the output",
"Make the prompt longer",
"Ask Claude to read more carefully"],a:1,
e:"Concise, prominent rules plus an example are much easier to follow than a rule buried in prose."},

{n:1,d:"t",q:"Meeting summaries from a Project keep missing action owners. What is the BEST way to fix this and confirm the fix?",
o:["Correct each summary by hand",
"Refine the Project instructions to require owners, then test on several past meetings to confirm",
"Switch to a different model",
"Stop recording meetings"],a:1,
e:"Fix the source (the Project instructions) and validate on known past examples before relying on it."},

{n:1,d:"t",q:"In a very long chat, Claude's answers start contradicting earlier decisions. What is this commonly called, and how is it fixed?",
o:["A permissions error. Change account settings",
"Context drift, sometimes called context rot. Summarize the agreed decisions and continue in a fresh chat",
"A model outage. Wait an hour",
"A formatting issue. Use bullet points"],a:1,
e:"Long contexts dilute earlier information. A verified summary in a fresh chat restores focus."},

{n:1,h:1,d:"t",q:"An associate's report prompt asks Claude to “be more detailed” each time the output is too thin, but quality doesn't improve. What is the MOST effective change?",
o:["Ask for “extremely detailed” output",
"Break the report into stages (outline, sections, review) and specify what each section must cover",
"Switch to the most capable model",
"Turn on extended thinking for every request"],a:1,
e:"Staging the work and specifying section content fixes thin output at its source. Adding intensity words doesn't define what's missing."}
);

// ===== Questions on topics from the user's uploaded practice exam (rewritten, harder, near-miss options) =====
BANK.push(
// ---------- Prompting (8) ----------
{u:1,d:"p",q:"An associate's prompt reads: “Write something about our return policy.” The draft is generic. Which rewrite fixes the MOST important gaps?",
o:["“Write a detailed, professional piece about our return policy for customers, covering every rule so nothing is left out.”",
"“For first-time online customers: explain our 30-day return policy in a friendly tone, in five short bullets.”",
"“You are a customer-service expert. Write about our return policy in a way customers will appreciate.”",
"“Write about our return policy, and make it clear, accurate and engaging for anyone who reads it.”"],a:1,
e:"The second rewrite adds audience, purpose, tone, length and format. The others add adjectives or a role but still leave the audience and output shape for Claude to guess."},
{u:1,d:"p",q:"Which order of prompt parts usually reads MOST naturally to Claude for a business request?",
o:["Task first, then context, then constraints, then format, so Claude knows the goal before the background",
"Context, then task, then format and constraints, so the request builds from situation to output",
"Format first, then task, then context, so Claude knows the output shape before reading anything else",
"Constraints first, then context, then task, so the limits frame everything that follows them"],a:1,
e:"Context, then task, then format and constraints mirrors how you'd brief a colleague: the situation, what you need, and the shape and limits. Order isn't a hard rule, but this one keeps requests easy to follow."},
{u:1,d:"p",q:"A support lead wants every complaint reply drafted in the same warm, apologetic voice. Which combination of techniques gives the MOST consistent result?",
o:["A role (“experienced, empathetic support agent”) plus one or two real replies that show the voice",
"A role (“experienced, empathetic support agent”) plus a list of adjectives describing the voice",
"A detailed paragraph describing the voice, plus an instruction to keep it the same every time",
"Two real example replies, plus an instruction to vary the wording so replies don't sound templated"],a:0,
e:"A role sets the overall stance, and real examples show the exact voice. Adjectives and descriptions are harder for Claude to match. Asking for variation works against the consistency the lead wants."},
{u:1,h:1,d:"p",q:"A prompt gives Claude a role and rich background, but the output is still not usable. Rereading it, the associate sees it never says what to produce. What is the BEST next step?",
o:["Add more background, since a richer picture of the situation usually fixes unusable output",
"State the task and the output format explicitly, then compare the new result with the old one",
"Switch the role to a more senior expert, since a stronger persona produces more usable work",
"Ask Claude what it thinks the associate wants, then accept whatever deliverable it suggests"],a:1,
e:"The missing ingredient is the task and the format. Adding background or changing the role doesn't tell Claude what to deliver. Letting Claude choose the deliverable gives up control of the result."},
{u:1,d:"p",q:"An associate asks Claude to “give me feedback on this proposal” and gets a page of general comments. Which revision would help MOST?",
o:["“Give me detailed, honest feedback on this proposal, and don't hold back on any criticism.”",
"“Give feedback on structure and clarity for a CFO audience, as the top five issues ranked.”",
"“Give me feedback on this proposal, covering all aspects, so I can improve it before sending.”",
"“Act as a senior consultant and give me thorough feedback on this proposal before I send it.”"],a:1,
e:"Naming the kind of feedback, the audience and a ranked, limited format focuses the review. “Honest”, “all aspects” or a consultant role still leave Claude to decide what matters."},
{u:1,h:1,d:"p",q:"A request has clear context, task and format, but no length guidance, and Claude's reply is three times longer than needed. Which change is MOST precise?",
o:["Add “be concise” at the end, so Claude knows that length matters for this request",
"Add a specific limit, such as “in three sentences” or “under 80 words”",
"Remove some of the context, since a long prompt tends to produce a long reply",
"Ask Claude to shorten the reply afterwards, repeating until it reaches the right size"],a:1,
e:"A measurable limit is the most precise fix. “Be concise” is vague, cutting useful context risks worse output, and repeated shortening takes extra rounds."},
{u:1,d:"p",q:"A first draft from Claude has the right content but the wrong tone for the audience. What does a good iteration loop suggest doing next?",
o:["Rewrite the whole prompt from scratch, since the first version clearly didn't work",
"Name the audience and the tone you want, and keep the rest of the prompt unchanged",
"Ask Claude to try again with no changes, since a second attempt often fixes the tone",
"Add a role and an example, change the format, and tighten the length all at once"],a:1,
e:"Iteration means reading the result, spotting what's wrong, and making a targeted change. Rewriting everything or changing many things at once makes it hard to know what helped, and an unchanged retry may repeat the problem."},
{u:1,d:"p",q:"A prompt reads: “Fix this email, write a LinkedIn post about the launch, and plan next week's team agenda.” The results are shallow. What is the BEST first step?",
o:["Add audience and tone details to the single prompt, so all three outputs improve together in one pass",
"Split it into three separate prompts, then add audience, tone and format details to each one",
"Number the three tasks in the same prompt, so Claude gives each one its own section",
"Ask for the three tasks to be done in more depth, keeping them together for efficiency"],a:1,
e:"Unrelated tasks bundled together get shallow treatment. Splitting them, then specifying each one, fixes both problems. Numbering or asking for depth keeps the bundle."},

// ---------- Evaluation (13) ----------
{u:1,d:"e",q:"A colleague says: “Claude sounded completely sure, so the figure must be right.” What is the MOST accurate response?",
o:["Claude's tone does reflect its certainty, so a confident, specific answer is a reasonable signal it's correct",
"Tone isn't evidence. Claude can state wrong facts just as fluently as right ones, so check key figures",
"Confident answers are usually right, so only figures that sound hesitant need to be checked",
"Ask Claude whether it is sure, and accept the figure if it confirms it a second time"],a:1,
e:"Fluency and confidence don't indicate accuracy. Important figures need checking against a trusted source. Asking Claude to confirm itself isn't verification."},
{u:1,d:"e",q:"Which kind of content in a Claude draft carries the HIGHEST risk of a confident error?",
o:["General explanations of well-known concepts, written for a non-specialist audience",
"Specific numbers, names, dates, quotes and anything about recent events",
"Rewordings of text the associate pasted into the chat, kept close to the original",
"Lists of brainstormed ideas, where many options are deliberately speculative"],a:1,
e:"Specific facts such as numbers, names, dates and quotes, and recent events, are where hallucinations most often appear and matter most. Brainstorms are meant to be speculative, and rewording supplied text is lower risk."},
{u:1,d:"e",q:"A procurement officer asks Claude for a competitor's “current” price without supplying any recent data. What is the MAIN risk?",
o:["Claude will refuse, because pricing information is commercially sensitive",
"The answer may come from older training data and be out of date, even if it sounds current",
"Claude will search the competitor's website automatically, which may breach that site's terms of use",
"The price may be in a different currency, so it will need converting before use"],a:1,
e:"Without supplied data or a search tool, Claude answers from training data that has a cutoff. The figure may be stale even when it's stated confidently."},
{u:1,d:"e",q:"What does a model's knowledge cutoff mean for a business user?",
o:["Claude stops answering questions about topics it learned about before that date",
"Claude's built-in knowledge ends at that date, so later events need to be supplied or searched",
"Claude can recall anything up to that date perfectly, so only later facts need checking",
"Claude's memory of earlier chats is deleted at that date, so older conversations can't be continued"],a:1,
e:"The cutoff is when training data was collected. Claude can still be wrong about earlier facts, so checking still matters. Newer information has to be provided, or found with search."},
{u:1,h:1,d:"e",q:"A team needs Claude's help with a briefing on a regulation that changed last month. Which approach is MOST reliable?",
o:["Ask Claude to explain the regulation, and add a note that it may be slightly out of date",
"Give Claude the current text or use search with citations, then check key points against the source",
"Ask Claude what it knows about recent changes, and use only the parts it says it's fully confident about",
"Use Claude's explanation of the old rules, since most regulations change only in minor ways"],a:1,
e:"Recent changes may be past the knowledge cutoff. Supplying the current text, or using search with citations, then checking against the source, is reliable. A caveat or Claude's self-reported confidence doesn't fix stale content."},
{u:1,d:"e",q:"A financial analyst isn't sure about one statistic Claude included in a client report. What is the BEST practice?",
o:["Ask Claude where the statistic came from, and keep it if Claude names a credible source",
"Check the statistic against a trusted primary source before it goes into the report",
"Round the statistic so that a small error won't matter in the final report",
"Keep it, but add a footnote saying figures were produced with AI assistance"],a:1,
e:"Check specific figures against a trusted source before use. Claude can name sources that don't exist or don't support the figure. Rounding or a footnote doesn't make a wrong figure right."},
{u:1,h:1,d:"e",q:"Why does verifying one key number in a Claude draft often take only a few minutes?",
o:["Because Claude marks the numbers it is unsure about, so you know exactly which ones to check",
"Because checking one specific fact against a source is quick, unlike re-checking the whole draft",
"Because numbers in Claude drafts are usually correct, so a quick look is normally enough",
"Because a second AI tool can confirm the number instantly, without needing to find the original source"],a:1,
e:"Targeted checks of specific facts are fast and catch the errors that matter. Claude doesn't reliably flag its own uncertainty, and another AI tool isn't a primary source."},
{u:1,d:"e",q:"Which approach to reviewing Claude's answers is MOST efficient and safe?",
o:["Apply the same thorough review to every answer, so nothing important slips through",
"Scale scrutiny to the stakes: light for routine drafts, careful checks for facts and high-impact uses",
"Review only answers that look wrong or surprising, since most answers are correct and checking wastes time",
"Review answers on topics Claude is weaker at, and trust those on topics it knows well"],a:1,
e:"Scrutiny should scale with the stakes. Uniform review wastes time on low-stakes drafts. Reviewing only what looks wrong misses confident errors, and you can't reliably tell which topics Claude knows well."},
{u:1,d:"e",q:"A colleague asks Claude for yesterday's match result and tomorrow's exact temperature, without search turned on. What should they expect?",
o:["Both answers will be accurate, because Claude has access to live sports and weather data by default",
"Neither can be relied on: the match is past the cutoff, and the forecast needs live data",
"The match result will be accurate, but the temperature will be an estimate",
"Claude will refuse both questions, since it can't discuss events or the weather"],a:1,
e:"Without search or supplied data, Claude has no reliable access to recent events or live forecasts. It may still produce an answer, which is why such answers need checking."},
{u:1,d:"e",q:"A request reads: “What was our exact revenue last quarter, to the dollar?” Why does this need extra care?",
o:["Because Claude can't do arithmetic, so it will refuse to give a figure",
"It's a specific, high-stakes number, so take it from the finance system or verify it there",
"Because revenue is confidential, so Claude will give only a rounded estimate",
"Because questions about exact money figures need the most capable model tier to answer accurately"],a:1,
e:"Exact financial figures are high-stakes and specific, so the reliable source is the company's own finance system. A capable model can still misstate a figure it was never given."},
{u:1,h:1,d:"e",q:"An associate uses Claude to draft a reply to a hospital patient's question about medication timing. What is the MOST appropriate review?",
o:["Check the tone is warm and the reply is easy to understand, then send it",
"Have a qualified clinician check the medical content before anything is sent to the patient",
"Ask Claude to add a disclaimer that it is not medical advice, then send it",
"Compare it with a similar reply sent to another patient last month, and send it if the advice matches"],a:1,
e:"Medical guidance to patients is high-stakes, so a qualified person must check the content. A disclaimer or a past reply doesn't make the advice correct for this patient."},
{u:1,d:"e",q:"A comms team traces a Claude-drafted statistic back to its original source before a public announcement. What does this show?",
o:["Unnecessary caution, since Claude's statistics are reliable enough for public use",
"Output verification matched to the stakes of a public, attributable statement",
"A lack of trust in Claude, which slows down the team's announcement process",
"Good practice only if the statistic looked unusual or surprising to the team"],a:1,
e:"Public statements carry reputational risk, so checking statistics against the original source is proportionate. A plausible-looking figure needs checking too, since errors don't always look unusual."},
{u:1,h:1,d:"e",q:"In a set of Claude-drafted customer replies, which TWO findings MOST clearly mean a reply must be fixed before sending? (Select TWO.)",multi:2,
o:["A refund amount that doesn't match the order record",
"A promised delivery date the business never agreed",
"A greeting that is slightly more formal than usual",
"A reply that is two sentences longer than the template",
"A sentence that could be split into two for readability"],a:[0,1],
e:"A wrong amount and an unagreed commitment are factual errors that could cost money and trust. Formality, length and sentence structure are style points that may be worth adjusting, but don't make a reply wrong."},

// ---------- Products & models (7) ----------
{u:1,d:"m",q:"A non-developer needs Claude to gather data from several files, compare vendors, and draft a report as one multi-step job on their desktop. Which surface fits BEST?",
o:["Claude.ai, in one long chat where each step is requested one message at a time",
"Claude Cowork, which is built for bigger, multi-step work by non-developers",
"Claude Code, since multi-step jobs need a tool designed for developers",
"Claude in Excel, since the vendor comparison involves organizing figures"],a:1,
e:"Claude Cowork is designed for non-developers handing off larger, multi-step work. A long chat can work but takes constant supervision. Claude Code is for software developers, and Excel covers only one part of the job."},
{u:1,d:"m",q:"A team is debating announcement wording in a Slack thread and wants Claude's suggestions where everyone can see and react to them. Which option fits BEST?",
o:["One person asks Claude in Claude.ai, then pastes the best suggestion into the thread",
"Bring Claude into the Slack conversation, so the whole team sees and builds on its input",
"Each team member asks Claude separately, then they compare their answers in the thread",
"Create a shared Project in Claude.ai and ask everyone to read its chats after the meeting"],a:1,
e:"Claude in Slack lets the whole thread see and build on suggestions in real time. Pasting from a private chat, separate chats, or a Project read later all lose the live, shared discussion."},
{u:1,d:"m",q:"An analyst wants a running-total-by-category formula built directly in their budget workbook. Which surface is the MOST direct fit?",
o:["Claude.ai, asking for the formula and then copying it into the right cells of the workbook by hand",
"Claude in Excel, which works on formulas, formatting and data cleanup in the sheet",
"Claude in Chrome, searching help sites for an example formula to adapt",
"Claude Cowork, handing off the entire budget workbook as a multi-step task"],a:1,
e:"Claude in Excel works inside the spreadsheet, so there's no copying between tools. Claude.ai works but adds a manual step. Cowork is for larger multi-step jobs, not a single formula."},
{u:1,d:"m",q:"A researcher needs to compare five competitor websites they already have open, without copying text into another tool. Which surface fits BEST?",
o:["Claude.ai, pasting each website's text into the chat one page at a time",
"Claude in Chrome, which works with what's open in the browser",
"Claude in PowerPoint, so the comparison ends up straight in slides",
"Claude Code, since reading websites is a technical task for developers"],a:1,
e:"Claude in Chrome acts as a browsing agent on the pages already open. Pasting into Claude.ai works but is slow and error-prone, and the other surfaces are built for slides and code."},
{u:1,h:1,d:"m",q:"A product manager learns her engineers use Claude Code to fix bugs. What is the MOST accurate takeaway for her?",
o:["She should learn Claude Code, since all associates are expected to use every surface",
"She needn't use it, but knowing what it does helps her plan around her team's workflow",
"Claude Code is the same as Claude.ai, so she can do the engineers' tasks in her own chats",
"She should ask the engineers to stop, since code changes by AI aren't allowed in most companies"],a:1,
e:"Claude Code is for developers working in their own tools. A non-developer doesn't need to use it, but understanding it helps with planning and communication. It isn't interchangeable with Claude.ai."},
{u:1,d:"m",q:"A founder has a rough outline and needs a structured investor deck by morning. Which surface fits BEST for building the slides?",
o:["Claude.ai, asking for slide text and then pasting each slide into the deck by hand",
"Claude in PowerPoint, which turns ideas into structured slides inside the deck",
"Claude in Excel, since investor decks rely mainly on financial tables",
"Claude in Chrome, researching investor deck templates to copy"],a:1,
e:"Claude in PowerPoint works inside the deck, turning an outline into structured slides. Claude.ai can draft text, but moving it slide by slide is slower."},
{u:1,h:1,d:"m",q:"Two associates use different Claude tiers for tasks that look similar: tagging support tickets and drafting a sensitive complaint reply. Which explanation is MOST accurate?",
o:["One of them is wrong, since similar-looking tasks should always use the same tier",
"The needs differ: tagging is high-volume and simple, the reply is high-stakes and nuanced",
"The most capable tier should be used for both, since quality always matters",
"The lightest tier should be used for both, since both are short pieces of text"],a:1,
e:"Tier choice depends on what the task needs: speed and cost for simple high-volume work, depth for nuanced, high-stakes writing. Tasks that look alike can need different tiers."},

// ---------- Workflow (10) ----------
{u:1,d:"w",q:"A payroll team needs exact commission payouts for 1,200 employees from a detailed formula. What is the BEST use of tools?",
o:["Have Claude calculate all 1,200 payouts in chat, then spot-check a sample of results against the formula",
"Run it in a spreadsheet or payroll system, and use Claude to explain results or draft messages",
"Have Claude write the formula, then run it in chat on the full data set",
"Split the employees into batches of 100 and have Claude calculate each batch"],a:1,
e:"Precise calculation at scale belongs in a dedicated system. Claude adds value around it, such as explaining results or drafting messages. Batching or spot-checking doesn't make chat-based arithmetic the right tool."},
{u:1,d:"w",q:"Which task is the WEAKEST fit for Claude on its own?",
o:["Summarizing 500 customer survey responses into themes",
"Tracking delivery trucks' live locations in real time",
"Explaining a technical concept for a non-technical audience",
"Brainstorming taglines for a new product launch"],a:1,
e:"Live, real-time tracking needs a purpose-built system with live data feeds. The others are language and reasoning tasks Claude does well."},
{u:1,d:"w",q:"When deciding whether a new, unfamiliar task suits Claude, which set of questions is MOST useful?",
o:["Is it urgent? Is it new? Has anyone else on the team tried it with Claude before, and did it work?",
"Does it need language or reasoning? Live data? Exact maths at scale? What's at stake?",
"Is it long? Is it creative? Would the most capable model tier be needed?",
"Is it repetitive? Is it boring? Would automating it save the most time?"],a:1,
e:"Asking about language and reasoning, live data, exact calculation and stakes points the task to Claude, another tool, or a mix. Urgency, length or tedium don't tell you whether Claude fits."},
{u:1,d:"w",q:"A team lead skips Claude for brainstorming packaging ideas, saying “it doesn't need a special tool.” What is the BEST response?",
o:["Agree, since brainstorming is quick and people come up with better ideas without tools",
"Point out that idea generation is a strong fit for Claude, and suggest trying it for a wider range",
"Agree, but suggest using Claude afterwards to check the ideas for spelling",
"Suggest using the most capable model tier, since creative tasks like this need the deepest reasoning available"],a:1,
e:"Brainstorming is one of Claude's strengths, and skipping it misses an easy win. Using Claude only for spelling undersells it, and a lighter or balanced tier is usually fine for ideation."},
{u:1,h:1,d:"w",q:"A team's task involves web research, organizing the numbers, and building slides, using several Claude surfaces. What is the MAIN risk to manage?",
o:["Using more than one surface, since doing everything in one place is always more reliable",
"Losing or changing a number or fact as information moves between surfaces",
"Running out of usage limits, since each surface has a separate allowance",
"Getting different writing styles from each surface, since they use different models"],a:1,
e:"Moving between surfaces can suit each step, but facts and figures can be lost or altered in transfer, so check them at each handoff. Switching surfaces isn't a problem in itself."},
{u:1,d:"w",q:"A website's chat widget sends customer questions to Claude and shows the replies, without customers seeing Claude directly. What does this illustrate?",
o:["A Claude.ai Project shared publicly with the website's visitors",
"An API connecting the website's software to Claude behind the scenes",
"Claude in Chrome running on each customer's own browser",
"A Claude connector that gives customers access to the company's files"],a:1,
e:"An API lets one piece of software send requests to Claude and get responses automatically. That's how Claude ends up inside other products. It isn't a shared Project, browser agent or connector."},
{u:1,h:1,d:"w",q:"A sales manager re-explains the same three key accounts at the start of every chat. Which setup saves the MOST time over months?",
o:["One Project for all three accounts, with every account's files mixed together",
"A Project for each account, holding its background, files and instructions",
"A profile preference listing all three accounts' details for every chat",
"A saved document of the background to paste in at the start of each chat"],a:1,
e:"A Project per account keeps each account's context separate and ready in every new chat. Mixing accounts risks confusion, profile preferences apply everywhere, and pasting still repeats the work."},
{u:1,d:"w",q:"A team needs a catchy campaign slogan and a polished client pitch deck. Which combination of surfaces fits BEST?",
o:["Claude in PowerPoint for both, since the slogan will appear on the deck's title slide anyway",
"Claude.ai to brainstorm and refine the slogan, then Claude in PowerPoint for the deck",
"Claude Cowork for both, since two deliverables make it a multi-step project",
"Claude in Excel for both, so all options can be compared in one table"],a:1,
e:"Brainstorming suits an open chat, and deck building suits PowerPoint. Matching each part to its best surface beats forcing everything into one tool."},
{u:1,h:1,d:"w",q:"Which TWO tasks are BEST handed to Claude rather than a specialized system? (Select TWO.)",multi:2,
o:["Summarizing themes from 500 open-ended survey comments",
"Drafting a plain-language explanation of a new policy",
"Calculating exact refund totals across 3,000 orders",
"Monitoring live stock levels across ten warehouses",
"Reconciling bank transactions to the cent each month"],a:[0,1],
e:"Summarizing text and explaining in plain language are core language tasks. Exact totals, live monitoring and reconciliation to the cent need dedicated systems with precise calculation or live data."},
{u:1,d:"w",q:"A retail team assigns every task on its list to Claude, including live inventory tracking. What is the MOST likely issue?",
o:["Nothing, since Claude can handle any business task if the prompt is clear enough",
"Live tracking needs a purpose-built system with live data, so that task belongs elsewhere",
"The tasks should be split across several model tiers instead of one",
"The team should use Claude in Excel for all of them, since inventory and most of the other tasks are numerical"],a:1,
e:"Claude complements other tools. Live tracking needs real-time data feeds, which a chat assistant doesn't have by default. Changing tiers or surfaces doesn't solve that."},

// ---------- Configuration (7) ----------
{u:1,d:"c",q:"A consultant always wants concise, no-fluff answers in every conversation. What is the MOST efficient setup?",
o:["Add “be concise” to the custom instructions of each Project they use",
"Set the preference once in profile settings, so it applies across conversations",
"Start every new chat with a short message asking for concise answers",
"Create a Project called “Concise” with that instruction, and hold all conversations inside it"],a:1,
e:"Profile preferences apply across all conversations, so the rule is set once. Per-Project or per-chat instructions repeat the work, and one catch-all Project mixes unrelated work."},
{u:1,d:"c",q:"An HR specialist is drafting a handbook section as an artifact and asks for a warmer tone. What happens?",
o:["Claude writes a new version in the chat, which then has to be pasted over the old one",
"The artifact updates in its own panel, so the content stays in one place",
"A new Project is created to hold the revised version separately",
"The tone change applies to future artifacts only, not the current one"],a:1,
e:"Artifacts show content in a separate panel that updates in place as you ask for changes, so you don't need to copy and paste between versions."},
{u:1,d:"c",q:"A project lead returns from leave and wants the draft plan she discussed with Claude a week ago. What is the BEST approach?",
o:["Ask Claude in a new chat to recall last week's plan, since it remembers earlier chats",
"Search chat history for the conversation and continue it there",
"Start the plan again from scratch, since old chats can't be reopened",
"Ask a colleague to forward their copy of the plan from their own chats"],a:1,
e:"Chat history lets you find and continue earlier conversations. A new chat won't automatically recall a separate conversation unless memory features are set up and enabled."},
{u:1,h:1,d:"c",q:"A company's customer chatbot, built on Claude, is warm and on-brand in every conversation, without anyone typing that instruction. What MOST likely explains this?",
o:["The customers' profile preferences ask for a warm tone",
"A system prompt set once by the builders shapes every conversation",
"Claude learns the brand's voice from earlier customer conversations",
"A knowledge file on brand tone is uploaded by each customer"],a:1,
e:"A system prompt is a standing instruction set by whoever builds the application, and it applies to every conversation. Claude doesn't learn from past conversations by default, and customers don't set it."},
{u:1,h:1,d:"c",q:"In a Claude-powered app built on the API, a customer's follow-up question gets an answer that ignores what they asked earlier. What is the MOST likely cause?",
o:["The model tier is too light to understand follow-up questions",
"The app doesn't resend earlier turns, so Claude sees only the new message",
"The customer's follow-up was too short for Claude to answer",
"Claude's memory of the conversation was cleared by the app's system prompt between turns"],a:1,
e:"Through the API, Claude only sees what's sent in each request. For a multi-turn conversation, the app must include the earlier turns. A heavier tier won't recover history that wasn't sent."},
{u:1,d:"c",q:"What is a token, in the context of Claude?",
o:["One full word, so token counts always match word counts exactly",
"A small chunk of text, often part of a word, that Claude reads and writes",
"One sentence, which is the unit used to measure Claude's usage limits and costs",
"A login credential that allows an app to connect to Claude"],a:1,
e:"Tokens are small pieces of text, often parts of words. That's why token counts don't match word counts exactly, and why longer inputs and outputs use more of a limit or budget."},
{u:1,d:"c",q:"A finance team notices that summarizing full contracts costs far more than summarizing short customer messages. What explains this?",
o:["Contracts use specialist language, which is billed at a higher rate per word",
"Longer inputs and outputs contain more tokens, and usage is measured in tokens",
"Contracts need the most capable model tier, which is the only one that is billed",
"Each contract is a separate file upload, and uploads are charged individually"],a:1,
e:"Usage is measured in tokens across input and output, so longer documents and longer summaries cost more. Specialist vocabulary can add tokens, but there isn't a special per-word rate."},

// ---------- Governance (9) ----------
{u:1,d:"g",q:"An employee is about to paste a customer's full account number into a general chat to get help drafting a reply. What is the BEST practice?",
o:["Paste it, since the chat is private and only the employee can see it",
"Mask or remove the number unless it's needed and policy allows it in this tool",
"Paste only the last eight digits, which is usually enough to protect the customer",
"Paste it, then delete the chat once the reply is finished"],a:1,
e:"If the account number isn't needed for the task, mask or remove it, and follow policy on what the tool may hold. Partial numbers can still identify accounts, and deleting the chat afterwards doesn't undo sharing."},
{u:1,d:"g",q:"Which of these is the FIRST data-handling question an associate should be able to answer before using Claude at work?",
o:["Which model tier the company has approved for confidential client work",
"What company policy says may be shared with AI tools",
"Whether their chats are saved in chat history",
"How many tokens a typical document uses"],a:1,
e:"Knowing the organization's policy on what data can go into AI tools comes first, because the rules differ between organizations. The other points are useful but don't decide what may be shared."},
{u:1,d:"g",q:"An HR coordinator drafting a reference letter replaces the employee's ID number and home address with placeholders before asking Claude for help. What principle is this?",
o:["Anonymization, which makes any HR document safe to share with any tool",
"Data minimization: sharing only what the task needs, masking the rest",
"Prompt injection defense, which stops Claude from leaking the details",
"Encryption, which protects the details while they're in the chat"],a:1,
e:"Masking details the task doesn't need is data minimization. It reduces risk, but doesn't make every document safe for every tool, and it isn't encryption or an injection defense."},
{u:1,h:1,d:"g",q:"A request reads: “Summarize this customer's full account file, including their card number.” What is the MAIN concern?",
o:["The summary may be too long if the account file is large",
"It shares sensitive payment data that a summary doesn't need",
"Claude may refuse to summarize financial documents of any kind",
"The card number may be summarized incorrectly in the output"],a:1,
e:"Card numbers are sensitive payment data, and a summary doesn't need them. They should be removed before sharing, whatever the length or accuracy of the summary."},
{u:1,d:"g",q:"A scheduling coordinator shares only the appointment type, not the patient's medical history, when asking Claude to draft a reminder. What does this show?",
o:["Unnecessary caution, since medical history improves the quality of the reminder",
"Sharing only what the task needs, consistent with responsible data handling",
"A misunderstanding, since health data is fine in any chat that isn't shared",
"Good practice only if the patient hasn't given consent to share their records"],a:1,
e:"The reminder only needs the appointment type. Leaving out medical history follows data minimization whether or not consent exists, and health data needs particular care."},
{u:1,h:1,d:"g",q:"An associate thinks a temporary chat is fine for pasting full customer ID numbers “just this once.” Which response is MOST accurate?",
o:["Correct, since temporary chats aren't saved and so data obligations don't apply",
"Policy and the approved tool decide, not chat mode, so mask or leave the IDs out",
"Correct, as long as only a few IDs are pasted and the temporary chat is closed straight away afterwards",
"Incorrect only for health data. Other personal data is fine in temporary chats"],a:1,
e:"Chat mode doesn't change what policy allows. If the IDs aren't needed, mask or leave them out. Volume or speed of deletion doesn't make sharing permitted."},
{u:1,d:"g",q:"Why does good data handling with Claude mostly need awareness rather than technical skill?",
o:["Because the AI tool detects and removes sensitive data automatically before processing it",
"Because habits like pausing before pasting and masking details are simple to follow",
"Because only IT teams are responsible for what data goes into AI tools",
"Because data rules are the same everywhere, so they're easy to memorize"],a:1,
e:"Simple habits such as thinking before pasting, masking unnecessary details and checking policy prevent most problems. Tools don't strip sensitive data reliably, rules differ between organizations, and everyone shares responsibility."},
{u:1,d:"g",q:"An organization's AI data rules differ from those at an associate's previous employer. What should the associate do?",
o:["Follow the stricter of the two sets of rules, to be on the safe side",
"Learn and follow the current organization's policy, since rules vary between organizations",
"Follow the previous employer's rules until told otherwise, since they're already familiar and tested",
"Follow general best practice only, since company policies are usually out of date"],a:1,
e:"Each organization sets its own rules, so the current employer's policy applies. Being stricter than policy is fine in places, but the policy defines what's allowed and what's required."},
{u:1,h:1,d:"g",q:"Before pasting a document into Claude, which TWO checks matter MOST? (Select TWO.)",multi:2,
o:["Does it contain personal or sensitive details the task doesn't need?",
"Does company policy allow this kind of data in this tool?",
"Is the document short enough to fit in one message?",
"Was the document written by someone in the associate's own team?",
"Will the chat be saved in history after the task is done?"],a:[0,1],
e:"Removing details the task doesn't need, and confirming policy allows this data in this tool, are the key checks. Length, authorship and history settings don't decide whether sharing is appropriate."},

// ---------- Troubleshooting (6) ----------
{u:1,d:"t",q:"An answer still feels generic even after the associate specified length and format. What is MOST likely missing?",
o:["A more capable model tier, since generic answers come from lighter tiers",
"The audience, purpose or context, which tell Claude who it's for and why",
"A stricter length limit, since shorter answers are less generic",
"Capital letters on the key instructions, so Claude pays closer attention"],a:1,
e:"Length and format shape the output, but audience, purpose and context make it specific. A different tier, a tighter limit or capitals don't supply the missing information."},
{u:1,d:"t",q:"A request asks for “the pros and cons of switching vendors” and returns a dense paragraph that's hard to scan. What is the BEST fix?",
o:["Ask Claude to be clearer, since the content was hard to read",
"Ask for a table with Pros and Cons columns for each vendor",
"Ask for a shorter answer, so the paragraph is easier to scan",
"Ask Claude to rewrite the paragraph in simpler language"],a:1,
e:"The missing piece is a requested format. A table with named columns makes a comparison easy to scan. Shorter or simpler prose is still a paragraph."},
{u:1,h:1,d:"t",q:"A team keeps getting Claude replies in paragraphs, though the person wants bullets in every chat. Their Projects say nothing about format. What should they check FIRST?",
o:["Whether the model tier supports bullet points in its replies",
"Whether the bullet preference is actually saved in their profile settings",
"Whether each Project needs its own instruction asking for bullets",
"Whether Claude has been told the preference enough times in past chats to remember it"],a:1,
e:"A preference meant for every chat belongs in profile settings, so first confirm it's saved there. Corrections in past chats don't carry over, and all tiers can write bullets."},
{u:1,d:"t",q:"An associate keeps asking Claude to “improve” a draft, and each version changes in random ways. What is the MOST effective fix?",
o:["Keep asking, since the draft will settle into a good version after a few more rounds of improvement",
"Say exactly what to change, such as clarity of the opening or the length of section 2",
"Ask Claude to make only small improvements each time",
"Start a new chat for each round, so earlier versions don't interfere"],a:1,
e:"Iteration works when each round targets a specific problem. “Improve” is undefined, so changes are random. Small or fresh-chat rounds still lack direction."},
{u:1,d:"t",q:"An associate's prompt to Claude reads only: “Is this a good idea?” and the reply is unhelpful. What is the BEST diagnosis?",
o:["The question is too short for Claude to process properly",
"There's no context: no idea described, no goal and no criteria for “good”",
"The question needs a role, such as “act as a business strategist”",
"The question should be asked in a Project with relevant files, rather than in a plain chat"],a:1,
e:"Claude can't judge an idea it hasn't been given, against goals and criteria it doesn't know. A role or a Project doesn't fill in the missing context."},
{u:1,h:1,d:"t",q:"A Claude-powered internal tool's monthly bill doubled after a team began pasting entire 80-page reports to ask one-line questions. Which change addresses the cause MOST directly?",
o:["Switch to the most capable model tier, so each answer is right first time",
"Send only the relevant sections, or summarize once and reuse the summary",
"Ask Claude to give shorter answers, since output is the main cost driver",
"Limit the team to a fixed number of questions per day"],a:1,
e:"Usage is measured in tokens, and the large inputs are the cause. Sending only what's needed, or reusing a summary, tackles that. Shorter answers help less, a heavier tier usually costs more, and a question cap limits usefulness."}
);

var FIX=FIX||{};
Object.assign(FIX,{
0:{o:["“You are an HR onboarding specialist. Our new hires are graduates in week one. Summarize the attached leave policy so they can book time off. Under 200 words, no jargon, five bullets.”",
"“You are an HR onboarding specialist writing for new graduates. Summarize the attached leave policy in under 200 words as five bullet points, using plain English with no legal jargon.”",
"“Our new hires are recent graduates in their first week and need to book time off. Summarize the attached leave policy for them in five plain-English bullet points of under 200 words.”",
"“You are an HR onboarding specialist. Our new hires are graduates in their first week and need to book leave. Summarize the attached policy clearly so they understand exactly what to do.”"],
e:"Only the first has all five: role (HR specialist), context (graduates in week one), goal (so they can book time off), constraints (length, no jargon) and format (five bullets). The second has no goal, the third has no role, and the fourth has no constraints or format."},
1:{o:["Wrap each source in its own XML-style tags, such as <contract> and <notes>, and refer to them by name",
"Put the contract first and the notes second, with a line saying “the first document is the contract and the second is my notes”",
"Paste the contract and notes into two separate messages, and in a third message ask Claude to compare them",
"Add a heading above each document in bold, then ask Claude to “compare the two documents carefully against each other”"],
e:"Tags give each source a clear, nameable boundary, so instructions like “compare <notes> against <contract>” are unambiguous. Ordering, separate messages and bold headings help a little, but they leave the boundaries and references loose, so the mix-up can continue."},
2:{o:["Keep the single example and add “match the tone of this example but vary the opening and length freely”",
"Replace the example with a detailed written description of the house style, covering tone, length and structure",
"Provide three to five varied examples that show the range of acceptable openings and lengths",
"Use a different single example each time, so Claude never sees the same opening sentence twice in a row"],
e:"Several varied examples at once show which features are the pattern and which are incidental. One example plus a caveat still invites copying, a description loses the precision of examples, and rotating single examples just moves the over-copying to a new example."},
3:{o:["“Write it without bullet points, keep it brief and avoid any technical jargon or specialist terms.”",
"“Write two short paragraphs in plain English that a general reader can follow.”",
"“Please don't use bullet points, please keep it short, and please don't use any jargon at all.”",
"“No bullets. Under 150 words. No jargon. Make sure none of these rules are broken in the final draft.”"],
e:"Telling Claude what to do (two short paragraphs, plain English) describes the target directly. The other options restate the same prohibitions with softer wording, politeness or a word count, but still mostly say what not to do."},
4:{o:["“Keep subject lines under 50 characters so they are short, punchy and easy to read.”",
"“Keep subject lines under 50 characters, because most readers open our emails on phones where longer lines are cut off.”",
"“Subject lines must never exceed 50 characters. This is a strict rule with no exceptions for any campaign.”",
"“Write short subject lines, ideally under 50 characters, that make readers want to open the newsletter.”"],
e:"Giving the real reason (mobile truncation) lets Claude apply the intent to cases the rule doesn't cover, such as putting key words first. The others give the limit but a weak, generic or missing reason."},
5:{o:["Ask Claude to recheck its recommendation for mistakes before you rely on it",
"Ask Claude to work through each supplier's costs step by step before recommending",
"Give Claude a table of each supplier's terms so the inputs are clearer, then ask again",
"Ask for the recommendation and a confidence score, and rerun it if confidence is below 80%"],
e:"Explicit step-by-step reasoning before the conclusion fixes reasoning slips at their source. A recheck after the fact, a tidier input table or a self-reported confidence score don't change how the calculation is done."},
6:{o:["Ask Claude to draft a standard offsite pack (agenda, slides, briefing note) that can be adapted once the brief arrives",
"Share what's known (audience, length, purpose) and ask Claude what it needs to know before drafting",
"Ask Claude for a list of common offsite deliverables, then pick the most likely one and start drafting it",
"Describe the offsite to Claude and ask it to produce a first draft based on its best assumptions"],
e:"With an ambiguous request, give the known context and have Claude surface clarifying questions, which can also go back to the manager. Drafting a generic pack or working from assumptions risks effort on the wrong thing."},
7:{o:["“Section 3 reads like a sales pitch. Please rewrite it to be more factual and less promotional.”",
"“Rewrite section 3 so it is factual, not promotional. Readers are existing customers who want an update.”",
"“Keep everything as it is, but tone down the marketing language throughout the draft so it reads neutrally.”",
"“Rewrite the update so it sounds less like a pitch. Keep it the same length and use the same overall structure.”"],
e:"The best follow-up targets the problem section, says what to change and why (the audience). The first lacks the reason, the third changes the whole draft rather than the problem section, and the fourth is vague about where the problem is."},
8:{o:["Place the long document first and put the instructions and question after it, clearly separated",
"Ask Claude to pull out the relevant quotes from the document before answering",
"Put the question first, then the document, so Claude knows what to look for while reading",
"Split the document into ten-page chunks and ask the same question of each chunk separately",
"Summarize the document yourself first and give Claude the summary instead of the full text"],
e:"Document first with the question after it, and quotes before the answer, both help on long documents. Putting the question first works less well with long inputs, chunking loses cross-references, and your own summary throws away the detail Claude needs."},
9:{o:["“Compare the vendors in a table I can paste into a spreadsheet, with one row per vendor and the key details.”",
"“Return a table with columns Vendor, Annual price, Contract length, Key risk. One row per vendor, no commentary.”",
"“Produce a spreadsheet-ready comparison of the vendors covering price, contract terms and risk, as a clear table.”",
"“List each vendor with its annual price, contract length and key risk, formatted neatly so it is easy to copy.”"],
e:"Exact column names, one row per vendor and nothing outside the table make the output paste-ready. The others name the content but leave the columns, layout or extra commentary to chance."},
10:{o:["“You are an experienced compliance reviewer. Check this marketing copy carefully and flag anything risky.”",
"“Act as a compliance reviewer for a UK financial firm. Flag each risky claim against advertising rules and say why.”",
"“Act as a UK financial services compliance officer and confirm whether this copy is approved for publication.”",
"“Review this marketing copy for any compliance issues under UK financial advertising rules and list them.”"],
e:"The best role prompt ties a specific role to the rules, the task and the required output. The first is too generic, the third asks Claude for final approval that belongs to a person, and the fourth drops the role and the “why”."},
11:{o:["Give two or three approved past replies as examples, plus a short description of the voice",
"Write a detailed description of the brand voice (tone, vocabulary, sentence length) and include it in every prompt",
"Paste the company's full brand guidelines document into the prompt and ask Claude to follow it closely",
"Ask Claude to draft replies, then have the team edit them into the brand voice before sending each one"],
e:"Real examples show tone precisely, and a short description says which features matter. A description alone is less precise, a full guideline document is long and general, and editing every reply by hand doesn't teach Claude the voice."},
12:{o:["The quote is a likely hallucination. Remove it, and ask Claude to quote only verbatim text with its location",
"The quote may be a paraphrase of something in the transcript. Search the transcript for similar wording and keep it if found",
"The quote is likely invented. Keep the point it makes but present it as Claude's summary rather than a direct quote",
"Ask Claude where the quote came from, and keep it if Claude can explain which part of the interview it is based on"],
e:"A quote that isn't in the source should be removed, and future quotes tied to exact locations. Keeping the claim as a summary still presents unsupported content, and Claude's own explanation of where it came from isn't verification."},
13:{o:["“Answer from the attached documents where possible, and use general knowledge to fill any gaps.”",
"“Answer only from the attached documents, quoting the passage first. If it isn't there, say ‘not found’.”",
"“Answer only from the attached documents. If you are not completely sure, add ‘(unverified)’ to the answer.”",
"“Base every answer on the attached documents and include the document name so staff can look it up.”"],
e:"Restricting to the sources, quoting the supporting passage and giving explicit permission to say “not found” together reduce invention most. Filling gaps from general knowledge invites it, and labels or document names don't stop a guess."},
14:{o:["The figure is close enough for a summary, so it can stay as long as the source numbers are correct",
"It is a 25% increase (£10,000 on a £40,000 base), so recompute any figures before use",
"It is a 20% increase, because £10,000 is 20% of the new total of £50,000, so the statement holds",
"It should say “a 10,000 increase” instead, because percentages in summaries tend to confuse readers"],
e:"Percentage change uses the starting value: £10,000 ÷ £40,000 = 25%. Dividing by the new value gives 20%, which is the error Claude made. Figures should be recomputed independently."},
15:{o:["Check that each citation links to a reputable publication, and remove any that come from unknown sites",
"Ask Claude to re-run the search and confirm that the same three sources still support the briefing",
"Open each source and confirm it exists and says what the briefing claims",
"Add a note to the director saying the briefing was produced with AI and the sources have not been checked"],
e:"Only opening each source confirms it exists and supports the claim. A reputable domain can still be misquoted, a re-run by the same tool isn't independent, and a disclaimer passes the checking job to the director."},
16:{o:["Ask Claude to rate the plan from 1 to 10 and explain its score, so you get a more objective view",
"Ask for the strongest risks and reasons the launch could fail, framed neutrally",
"Ask Claude whether it is just agreeing with you, and take its answer into account when deciding",
"Share the plan with Claude again and ask for “honest feedback” on whether January is realistic"],
e:"Neutral framing plus an explicit request for risks counters sycophancy. A score or a request for “honest feedback” keeps the same leading frame, and asking Claude whether it's just agreeing doesn't produce counterarguments."},
17:{o:["As sufficient for internal documents, but needing human review only when the content goes outside the company",
"As a useful first pass against stated criteria, followed by human and source checks before release",
"As a reliable final check, provided the checklist is detailed and Claude confirms each item one by one",
"As a substitute for one of the two human reviewers normally required, since it covers the checklist items"],
e:"Self-critique against criteria catches real gaps cheaply, but it isn't independent. A press release is external, so it needs human and source checks. A detailed checklist doesn't make self-review independent, and it shouldn't replace a required human reviewer."},
18:{o:["Claude's knowledge has a cutoff date. Ask it to note that the answer may be out of date and use it with that caveat",
"Claude's training has a cutoff. Turn on web search or give it the current regulation text",
"The question was probably ambiguous. Rephrase it to name the exact regulation and the date of the change",
"Claude may be mixing two similar regulations. Ask it to list both and pick the one that applies"],
e:"The old answer comes from the training cutoff, so Claude needs the current source through web search or the regulation text. A caveat still leaves you with the wrong rule, and rephrasing doesn't give Claude information it never had."},
19:{o:["Accuracy, because the brief gives a misleading picture of what matters",
"Relevance, because it doesn't stay on the question the executive asked",
"Completeness, because the risk section is too short to be useful",
"Conciseness, because the brief is longer than one page in practice"],
e:"Every fact is correct, so accuracy holds. The brief spends half its length on something the executive didn't ask about, which is a relevance failure. A thin risk section and excess length are symptoms of that, not the core failure."},
20:{o:["A study attributed to “Harvard researchers (2023)” with no title or link",
"A direct quotation attributed to a named industry figure",
"A market-size estimate described as “widely reported”, without a specific figure",
"A paragraph summarizing the history of the industry over the past twenty years",
"A list of common challenges in the industry, written in general terms"],
a:[0,1],
e:"Vague study attributions and named quotations are specific, easy to invent and damaging if wrong, so check them first. A vague estimate with no figure, general history and generic challenges carry less factual risk."},
21:{o:["Rewrite both to describe the specific behaviors observed, and check AI-drafted HR content for bias as standard",
"Change “abrasive” to “assertive” in the second summary so both use the same neutral word, then approve them",
"Ask Claude to explain why it chose different words, and keep them if the explanation is reasonable",
"Flag the difference to HR, and keep both summaries as written until HR decides which word is correct"],
e:"Describing concrete behavior removes loaded labels, and a routine bias check catches repeats. Swapping one word fixes this case but not the practice, Claude's explanation isn't a fairness check, and leaving biased wording in place delays the fix."},
22:{o:["A list of interview questions for a junior marketing role, to be used by the hiring panel next week",
"A plain-language summary of medication interactions for a patient leaflet",
"A reformatted version of the company's travel policy for the staff intranet",
"A draft social media post announcing the opening of the company's new office"],
e:"Patient-facing medical content is specialized and high-stakes, so it needs qualified expert review. The others need normal checks but aren't in the same risk category."},
23:{o:["Ask a third time and use the figure that appears twice, since agreement between answers suggests it is right",
"The answer is unreliable. Check the source financial report before using either figure",
"Use the more conservative figure, since understating revenue is less risky than overstating it",
"Ask Claude to explain the difference between the two figures and use whichever it says is correct"],
e:"Inconsistent answers to the same factual question mean neither is reliable until checked against the source. Majority voting, picking the conservative figure or asking Claude to choose are all guesses."},
24:{o:["Ask each team member to send any draft they have doubts about to a team lead before it goes out",
"Define in advance which categories (large refunds, legal threats, safety complaints) must go to a human",
"Have Claude add a risk rating to each draft and send anything rated high to a team lead for review",
"Review a random 10% of drafts each day and send the rest without further checks"],
e:"Rules set in advance by risk category catch the cases that matter consistently. Individual doubt varies by person, a model's own risk rating isn't reliable, and random sampling can miss a high-risk reply."},
25:{o:["Ask Claude to list each claim with its page or section, then spot-check them against the report",
"Ask Claude to summarize the report a second time and compare the two summaries for differences",
"Read the report's executive summary and check that the main points match Claude's summary",
"Ask a colleague who knows the audit to read Claude's summary and say whether anything seems wrong"],
e:"Source locations for each claim make spot-checking fast and direct. A second summary isn't independent, the report's own executive summary may not cover every claim, and a colleague's impression isn't a check against the source."},
26:{o:["Change it to “employees and their spouses are welcome”, which is more formal and includes husbands",
"Change it to “employees and their partners or guests”, and check other drafts for similar wording",
"Change it to “employees and their families are welcome”, so that partners and children are both covered",
"Add a line at the end saying “all relationships are welcome”, and leave the rest of the invitation unchanged"],
e:"“Partners or guests” includes everyone, and checking related drafts catches repeats. “Spouses” still excludes unmarried partners, “families” changes the invitation's meaning, and an add-on line leaves the exclusive wording in place."},
27:{o:["Ask Claude to review the memo for logical gaps and fix any it finds before you send it",
"Ask Claude for the strongest counterarguments and what evidence would change the conclusion",
"Ask Claude to add supporting data from market reports to strengthen each argument in the memo",
"Ask a colleague to read the memo and tell you whether the recommendation is convincing"],
e:"A devil's-advocate pass tests the reasoning against the strongest opposing case. A general gap review is weaker, more supporting data reinforces the existing view, and a colleague's impression isn't a structured test."},
28:{o:["Ask two reviewers to rate each description out of 10 and average the scores",
"Score each draft against a rubric (accuracy to spec, length, tone, features), and spot-check with a human",
"Ask Claude to compare each description with the spec sheet and flag any it considers weak",
"Have the most experienced reviewer check all 50 to keep the judgments consistent"],
e:"A rubric defines what “good” means and makes scoring consistent and tied to accuracy. Averaged ratings without criteria stay subjective, Claude's own flags aren't independent, and one reviewer is consistent but not necessarily against the right standard."},
29:{o:["Ask Claude to answer using its general knowledge and to label that part of the answer as unverified",
"Treat it as useful: supply the missing document, or record that the information isn't available",
"Ask Claude what information is missing, then rephrase the question so it fits what the documents do contain",
"Ask Claude for its best estimate based on related information in the documents, and note it as an estimate"],
e:"Saying “not found” is the grounded behavior you want. Provide the source or record the gap. Asking for general knowledge or an estimate invites guessing, and rephrasing to fit the documents answers a different question."},
30:{o:["Reconcile the totals in the summary against the source ledger or spreadsheet",
"Have Claude show its calculations, then recompute the key figures independently",
"Ask Claude to check each figure in the summary against the source and confirm it matches",
"Compare the summary with last month's summary to make sure the figures move in a sensible direction",
"Have a second Claude chat produce the summary and confirm both give the same totals"],
a:[0,1],
e:"Reconciling against the source and recomputing independently are real verification. Claude checking itself isn't independent, a month-on-month comparison only catches large jumps, and a second chat from the same model can repeat the same error."},
31:{o:["A balanced tier (Sonnet-class), since eight themes need some judgment, checked on a sample first",
"A fast, low-cost tier (Haiku-class), checked on a sample before the full run",
"The most capable tier for a sample of 500 comments, then the fast tier for the rest using those results",
"The most capable tier (Opus-class), run in smaller overnight batches to keep costs within the budget"],
e:"Short-comment classification into clear themes is simple, high-volume work that suits the fastest, cheapest tier, with a sample check first. A balanced or top tier costs more for little gain on a task this simple."},
32:{o:["A balanced tier (Sonnet-class), with a request to reason through each factor in turn",
"The most capable tier (Opus-class), possibly with extended thinking",
"A fast tier for an initial pass, then the most capable tier to refine the analysis",
"The most capable tier for the legal factors, and a balanced tier for the rest"],
e:"Complex, multi-factor reasoning where quality matters more than speed is the use case for the most capable model, with extended thinking if needed. Splitting the analysis across tiers fragments the reasoning that needs to happen together."},
33:{o:["Opus-class as the default, since a department this size needs consistent high quality across every task",
"Sonnet-class as the everyday default, moving up or down for unusual tasks",
"Haiku-class as the default for speed, moving to Opus-class whenever a draft needs more care",
"Sonnet-class for drafts and Opus-class for summaries, since summaries need more careful reasoning"],
e:"Sonnet balances speed and quality for most everyday work. Opus as the default is slower and costlier than needed, Haiku as the default undershoots on drafting quality, and meeting summaries don't usually need the top tier."},
34:{o:["Summarizing a two-page meeting transcript into five action points for the team",
"Building a staff rota that satisfies many overlapping constraints on hours, skills and leave",
"Rewriting a 500-word customer email into a friendlier, more conversational tone",
"Translating a one-page product description into French for a partner website"],
e:"Extended thinking helps most on multi-step reasoning with many interacting constraints, such as a rota. Summarizing, tone rewrites and translation are handled well without the extra wait."},
35:{o:["Ask Claude for the competitor's last known prices and add an estimate for any recent change",
"Turn on web search so Claude finds and cites current sources, then check the sources",
"Upload the competitor's old price list and ask Claude to predict this week's likely changes",
"Turn on extended thinking so Claude reasons carefully about what the new price probably is"],
e:"This week's announcement is past the training cutoff, so Claude needs web search to find current, citable sources. Old data plus estimates, predictions or extra reasoning can't replace the actual announcement."},
36:{o:["A Team plan, which adds central admin and billing",
"An Enterprise plan",
"A Team plan with an add-on for audit logs",
"Individual Pro accounts managed by IT"],
e:"SSO, audit logs and stronger compliance controls at this scale are Enterprise-level features. Team plans add admin and billing but not the full security and compliance stack, and individual accounts lack central control."},
37:{o:["A Team plan",
"An Enterprise plan, to be ready for future growth",
"Individual Pro accounts with expenses claimed back",
"A Team plan for designers and free accounts for others"],
e:"Team plans add shared Projects and central billing without Enterprise's compliance stack, which this agency doesn't need yet. Individual accounts lack shared workspaces and central billing, and mixing account types fragments the setup."},
38:{o:["As a well-formatted inline message, which colleagues bookmark and copy each month",
"As an artifact: a standalone piece of content that can be edited and shared",
"As a Project instruction, so Claude reproduces the checklist whenever someone asks",
"As a table in the chat, which each colleague copies into their own spreadsheet"],
e:"An artifact is a standalone, reusable item people can open, edit and share. Inline messages and copied tables get lost or fragment into versions, and Project instructions guide Claude's behavior rather than storing a shared checklist."},
39:{o:["Keep it on, but write shorter prompts so the thinking finishes faster",
"Use extended thinking for complex reasoning only, and turn it off for simple tasks",
"Switch to the fastest model tier, keeping extended thinking on for every request",
"Turn it off completely, since the extra reasoning rarely changes the final answer"],
e:"Extended thinking pays off on complex reasoning and only adds delay on simple rewrites, so use it selectively. Turning it off everywhere loses the benefit on hard tasks, and a faster tier doesn't remove the thinking time."},
40:{o:["Extracting invoice dates and amounts from 3,000 standard invoices",
"Tagging incoming support tickets by product line",
"Summarizing each of 500 customer complaints into a short, empathetic reply",
"Drafting individual follow-up emails after 200 complex sales negotiations",
"Comparing 40 supplier contracts to find unusual liability clauses"],
a:[0,1],
e:"Well-defined, high-volume extraction and tagging suit fast, low-cost tiers. Empathetic replies, follow-ups on complex negotiations and spotting unusual contract clauses need more judgment, so a more capable tier is the better fit."},
41:{o:["Sending the weekly customer newsletter, drafted from the marketing team's notes",
"Converting the weekly sales export into the team's standard summary table",
"Replying to routine customer emails about delivery times, without review",
"Approving small expense claims under £50 automatically each month"],
e:"Automation fits low-risk, internal, repeatable work with easy-to-check output. Anything sent to customers or approving money carries external or financial risk, even in small amounts, and should keep a human step."},
42:{o:["Automate, because Claude handles each reply",
"Augment, because a person edits and decides",
"Human-only, because a person sends every reply",
"Automate with oversight, because drafts are checked"],
e:"Claude drafting while a person edits and decides is augmentation. Automation would mean Claude completes the task without the human decision, and human-only would mean no AI involvement in the work."},
43:{o:["Claude can draft the notification letters, which HR sends after a quick check, while managers hold the meetings",
"Claude can help prepare talking points and FAQs, but decisions and conversations stay with people",
"Claude can analyze performance data to suggest who is affected, with HR making the final decision",
"Claude can run the follow-up Q&A with affected employees by chat, so managers can focus on the meetings"],
e:"Redundancy decisions and conversations need human judgment and empathy. Claude helping prepare is appropriate. Suggesting who is affected, sending notifications with a quick check, or handling affected employees directly all hand sensitive parts to the tool."},
});
