var FIX=FIX||{}; Object.assign(FIX,{
270:{o:["Summarizing weekly project updates into a status report for the steering group","Drafting first-pass answers to routine supplier questionnaires for later review","Choosing which of two qualified finalists receives a job offer","Turning interview notes into structured themes that the hiring panel then discusses"],e:"Picking between two qualified finalists is a high-stakes judgment about people that needs accountable human decision-makers. The other tasks are drafting or structuring work that a human then reviews, even the one that touches hiring."},
271:{o:["Roll it out to all six offices in one go using the same template, then gather feedback after a month","Expand in phases with a documented SOP, training, local tweaks and ongoing quality checks","Let each office adapt the original prompts freely, then compare results at the end of the quarter","Document the SOP and train every office, then switch all six on the same day to keep things consistent"],e:"Phased expansion with an SOP, training, local adjustment and continued measurement lets problems surface early. A big-bang switch, even with an SOP and training, spreads any flaw to every office at once. Free adaptation loses the proven design."},
272:{o:["Add a fourth, senior reviewer at the end who reads every draft in full before it is released","Give each stage its own specific checks, and have each person sign off on theirs","Tell all three stages to check everything thoroughly, since more eyes on each draft catch more errors","Make the senior manager solely responsible for quality, so there is one clear owner for every error"],e:"The root cause is diffused responsibility. Distinct, signed-off checks per stage fix it. Another reviewer, or asking everyone to check everything, keeps the same assumption alive. One owner at the end overloads one person and drops the earlier checks."},
274:{o:["Average handling time per ticket, since speed is the main reason for adopting the workflow","Average handling time per ticket, paired with a quality measure such as CSAT","Customer satisfaction score on its own, since quality matters more than speed for support work","Number of tickets closed per agent per day, compared with the months before Claude was introduced"],e:"Efficiency needs a quality counterweight, or the team can get faster while customers get worse answers. Speed alone, satisfaction alone, or throughput alone each show only half of the picture."},
275:{o:["Claude drafts responses for all requests, and staff approve before sending","Refunds above a set value, or with unusual circumstances, go to a senior reviewer","Claude approves refunds under a set value automatically, and staff review a weekly sample of the decisions","Staff approve every draft, but skip approval when the queue exceeds a set size so the backlog stays manageable","Claude flags which requests need senior review using its own judgment, and staff review the flagged ones"],e:"Human approval of every response plus escalation by defined rules balances speed with control. Auto-approval with only sampled review lets errors reach customers. Skipping review under load removes the control when risk is highest. Letting Claude set the escalation rule leaves the risk boundary undefined."},
276:{o:["Agree, since Claude drafts reports faster, and suggest keeping the colleague on for a short transition","Share pilot evidence on what Claude does reliably, the review effort, and a redesigned role","Refuse to run a pilot, because evaluating role changes is a matter for HR rather than the associate","Agree to a pilot, but measure only drafting speed, since that is the main thing the manager wants to know"],e:"A constructive response grounds the discussion in evidence, including the review effort Claude's output still needs, and points to higher-value work. A speed-only pilot hides the review cost. Simply agreeing, or refusing to engage, skips the evidence."},
277:{o:["Ask them to export all their prompts into a shared folder before they leave, so nothing is lost","Document the workflow (prompts, inputs, checks, owners) in a shared SOP and name a successor","Ask them to train a colleague informally during their notice period, so the knowledge passes on directly","Name a successor and let them take over the existing chats, so they can see exactly how it was run"],e:"Continuity needs both documentation of the full workflow (not just the prompts) and a named owner. Exported prompts lack the checks and inputs. Informal training and inherited chats leave no lasting record of how it works."},
278:{o:["Upload more files so that every question users are likely to ask is covered by the knowledge base","Add: “If the files don't contain the answer, say so instead of using general knowledge”","Add: “Always prefer the knowledge files”, so Claude knows the files take priority over general knowledge","Add: “Answer from the knowledge files where possible”, and ask users to flag any answers that look wrong"],e:"Claude needs explicit instructions for when the files don't have the answer. “Prefer” and “where possible” still allow general-knowledge answers. More files can never cover every question."},
279:{o:["Rename the file “IMPORTANT_Style.pdf” and mention its name in the Project's custom instructions","Put the core style rules in the custom instructions and keep the full guide as knowledge","Paste the entire style guide into the custom instructions and remove the knowledge file altogether","Ask users to start each chat by telling Claude to read Style.pdf before it writes anything"],e:"Custom instructions apply to every chat. Knowledge files are consulted when they look relevant. The core rules belong in instructions and the detail in knowledge. Pasting the whole guide into the instructions makes them long and diluted. Renaming the file or relying on users is inconsistent."},
280:{o:["Delete the Project instructions, since profile preferences apply everywhere and should take priority","Make the profile preference more general or conditional, so it doesn't clash with Projects","Add “use paragraphs” to the start of every chat in that Project, so the conflict resolves in favor of prose","Keep both, and add “profile preferences override Project instructions” so Claude knows which to use"],e:"The conflict comes from a blanket profile rule. Making it conditional removes the clash at its source. Per-chat reminders are fragile. Declaring that the profile wins gives the wrong result for this Project."},
281:{o:["Keep all files, and add an instruction: “Prefer the newest file whenever two files conflict”","Remove superseded files so only current policy remains, and set a review cycle","Keep all files, and add the year to each file name so Claude can work out which one is current","Move older files into a separate “archive” Project, so they remain searchable for historical questions"],e:"Removing superseded content solves the conflict at its source, and a review cycle keeps it solved. A “prefer newest” rule or dated names still leave contradictory material that Claude may draw on. An archive Project is reasonable for history, but is not the main fix."},
282:{o:["The whole drive, in case other files become relevant later in the project","The single folder, following least privilege and company policy","The whole drive, with an instruction telling Claude to read only the project folder","The single folder for now, widened to the whole drive if colleagues ask for access"],e:"Least privilege means granting only the access the task needs. An instruction to ignore the rest doesn't limit access. Widening access on request should go through policy, not happen by default."},
283:{o:["Moving on to a different deliverable after a long conversation","Claude's responses drifting after many turns on the same task","Needing different Project instructions for one question, so the new chat can use other rules","Wanting Claude to stop using the Project's knowledge files for a general question","Wanting Claude to forget a correction from earlier in the same chat, so it starts fresh"],e:"A new chat in the same Project clears long or drifting history while keeping the Project's instructions and knowledge. It doesn't change the instructions or remove the knowledge files. Wanting to forget a useful correction is not a reason to restart."},
284:{o:["Keep all rules, and repeat the later rules at the top as well so they get equal attention","Cut to the essential, prioritized rules and move detailed reference into knowledge files","Keep all rules, and number them with a note saying every rule is equally important","Split the rules into themed sections with headings, keeping all 2,500 words in the instructions"],e:"Very long instructions dilute attention. Prioritizing the essentials and moving reference material into knowledge files fixes the cause. Repeating, numbering or sectioning the rules keeps the overload."},
285:{o:["It isn't a concern, because without names or emails the data counts as anonymous","Combinations of fields can re-identify people, so it may still be personal data","It is only a concern if the file also contains free-text comments from the customers","It is only a concern if the file is shared outside the company after the analysis"],e:"Quasi-identifiers such as job title, postcode and company size can single someone out together, so the data may still be personal. The risk exists whether or not there are free-text comments and before anything is shared."},
286:{o:["Use the enterprise workspace, since an approved tool is cleared for all company data","Check whether policy allows Restricted data in that workspace, since tool approval doesn't cover every class","De-identify the names and proceed in the enterprise workspace, since that lowers the class","Ask their manager to approve the use, since a manager can authorize exceptions for one task"],e:"Tool approval and data-class permission are separate questions. Removing names may not change the classification of health data. A manager's sign-off doesn't replace data policy."},
287:{o:["Trust Claude to judge which emails are legitimate, since it can spot common phishing patterns","Limit Claude to summarizing and require the associate's approval for actions like forwarding","Ask Claude to ignore suspicious emails and act only on the urgent ones that look legitimate","Allow Claude to forward files only to internal addresses, so external requests are blocked automatically"],e:"Email content can contain injected instructions. Requiring human approval for actions is the reliable safeguard. Claude's judgment or an internal-only rule still lets a crafted request through, since internal addresses can be compromised too."},
288:{o:["Anthropic is accountable, since its model produced the statistic","The publishing team is accountable. They should correct it publicly and tighten verification","The team is accountable, and should quietly fix the online version to limit reputational damage","Both are equally accountable, so the team should correct it and report the error to Anthropic"],e:"Whoever publishes the content owns its accuracy. A public correction and better verification are the responsible steps. A silent fix isn't transparent, and the model provider doesn't share accountability for what the team chose to publish."},
289:{o:["The copy may run too long for typical product listings and need cutting","It risks trademark, copyright and misleading customers. Original messaging is safer","Echoing slogans is fine if the copy also names the company's own product clearly","There is no concern, since writing styles can't be owned by any company"],e:"Closely echoing a competitor's slogans risks IP issues and customer confusion. Naming your own product doesn't remove that. General style isn't owned, but specific slogans and campaigns can be protected."},
290:{o:["Whether policy permits this data class in this tool and workspace","Whether the file contains personal or confidential data that should be removed first","Whether the file is from a trusted colleague, since that confirms it is safe to share","Whether the file was already shared with another approved tool, which shows it is cleared","Whether the file is under the upload size limit, so Claude can read all of it"],e:"Data-class permission and removing sensitive content are the key pre-upload checks. A trusted sender or earlier use elsewhere doesn't establish permission for this tool. Size limits affect usability, not safety."},
291:{o:["A fixed template so every summary uses the same headings and word count","Manager review of each summary for accuracy and biased language before release","An HR spot check of one in ten summaries for tone before they are released","Using the most capable model, since it is least likely to introduce bias"],e:"Performance reviews affect people directly, so each summary needs review by the accountable manager for accuracy and bias. Spot checks miss most summaries. A better model doesn't remove the need for review."},
292:{o:["Skip disclosure, since company policy is silent and that takes precedence","Follow the platform's terms and disclose, and raise the policy gap with its owner","Disclose this time, and leave company policy alone since the platform's rule covers it","Edit the post substantially by hand so it no longer counts as AI-generated content"],e:"The platform's terms apply even where company policy is silent. Raising the gap helps the next person. Editing to avoid the label is evasive. Leaving the policy gap unreported means the same question comes up again."},
293:{o:["Write it, since press releases are promotional and readers expect some exaggeration","Decline the claim as misleading and a likely ad-rule breach, and offer evidence-based wording","Write it with “results may vary” added, which makes the claim acceptable under ad rules","Write it, and send it to legal for review, since legal is responsible for checking claims"],e:"An unsupported “clinically proven” claim is misleading. A caveat doesn't fix that, and passing it to legal shifts responsibility instead of taking it. Offering accurate, evidence-based wording is the constructive response."},
294:{o:["The model tier, which may have been changed by an admin without notice","The input data and knowledge files, for changes such as a new version or format","The prompt wording, since prompts can stop working as models are updated","The output format, since a formatting change can make figures appear in the wrong place"],e:"When the prompt is unchanged and outputs suddenly go wrong, the most common cause is the inputs: a new file version or changed source format. Check the data first, then other factors."},
295:{o:["Changing three things at once takes longer than changing them one at a time","They can't tell which change helped, so they can't reliably keep or reuse it","The improvement might be temporary, so the prompt needs to be re-tested every week","The examples will dominate, so the role and format changes probably had no effect"],e:"Changing several variables at once confounds the result. Without isolating changes, you can't tell what worked. The other options guess at effects instead of identifying the real limitation."},
296:{o:["The format rules are ambiguous. Rewrite them so they are clearer and more specific","Long history dilutes the instructions. Start fresh chats and restate key rules in long ones","Long chats hit the context limit and drop the instructions. Switch to a larger model","The format rules conflict with later messages. Delete earlier messages in the chat"],e:"As chats lengthen, earlier instructions carry less weight. Fresh chats and restating key rules fix this. The rules work in short chats, so they aren't the problem, and Project instructions aren't simply dropped."},
297:{o:["Claude ignored the correction. Repeat it more firmly at the start of each new chat","Corrections don't carry over between chats. Put the rule in the Project instructions","Claude learned the correction but forgot it overnight. Turn on memory to keep it","The error is random. Ask Claude to double-check formatting at the end of each reply"],e:"Corrections live in a single conversation. Durable rules belong in Project instructions or a template. Repeating them manually each time is fragile, and asking for a self-check doesn't address the cause."},
298:{o:["Set a measurable limit, such as “one sentence, maximum 25 words”","Provide two or three example summaries at the target length","Ask Claude to “be brief and concise” at the start of every request","Ask Claude to shorten each summary after it writes the first version","Explain that the summaries feed a dashboard with limited space"],e:"Measurable limits and examples at the target length are the most effective controls. “Be brief” is vague. A second shortening pass doubles the work. Explaining the context helps, but without a measurable target the length still varies."},
299:{o:["Ask the team to spell out acronyms in their questions from now on","Add a glossary of the team's acronyms to the Project knowledge or instructions","Create a separate Project for that team with its own instructions","Ask Claude to ask for clarification whenever it sees an unknown acronym"],e:"A glossary gives Claude the missing context once, for everyone. Changing user behavior is fragile. A separate Project duplicates effort. Asking for clarification every time slows the team down without fixing the gap."},
300:{o:["Write the steps as one flowing paragraph so the logic between them is clearer","Present the steps as a numbered list and say they must be done in that order","Present the steps as a bulleted list and put the most important step in bold","Ask Claude to be careful about the order and to check its work at the end"],e:"A numbered list plus an explicit order requirement removes ambiguity. Bullets don't show order. Asking for care and a check at the end is vague."},
301:{o:["Start a new chat and describe only the latest fix, so earlier turns can't interfere","Keep a running list of agreed requirements and include it with each revision request","Ask Claude to remember everything that was agreed and to check before each change","Ask for one fix per message, so each change is small and less likely to break others"],e:"Restating the full set of agreed requirements each time stops regressions. A fresh chat with only the latest fix loses earlier agreements. Asking Claude to remember, or splitting fixes up, doesn't keep the full set in view."},
302:{o:["A long email to one colleague covering several topics in a single message","A deliverable for three audiences where later sections depend on earlier figures","A request to rewrite a long report in a more formal tone throughout","A set of answers to ten unrelated factual questions in one message"],e:"Dependencies between parts and multiple audiences are the clearest signal for breaking work into steps. Long or multi-part requests without dependencies can often be handled in one prompt."},
303:{o:["Ask for a full rewrite straight away, with a note to focus on the weakest sections","Have Claude critique against stated criteria, agree the fixes, then ask for the rewrite","Ask Claude to critique the draft and rewrite it in the same response to save time","Ask for three different rewrites and merge the best parts of each into one version"],e:"Separating critique from rewrite, with clear criteria and agreement in between, targets the real weaknesses. Critiquing and rewriting in one go skips the agreement step. Asking for more rewrites doesn't fix the missing diagnosis."},
304:{o:["Ask for one update written to suit both audiences, with a short summary at the top","Ask for two labeled outputs, each with its audience, purpose and length specified","Ask for two labeled outputs, one for executives and one for frontline staff","Ask for the executive version first, then ask Claude to adapt it for frontline staff"],e:"Two outputs, each with audience, purpose and length specified, gives Claude what it needs for both. Labels alone leave purpose and length unstated. Adapting from the executive version risks carrying over the wrong focus."},
305:{o:["Ask for “the most important commercial points” from each contract instead","Define exactly which fields to extract and what to write when one is missing","List the fields to extract (renewal date, notice period, liability cap)","Ask Claude to use its judgment more carefully and be consistent across contracts"],e:"Consistent extraction needs a defined field list and a rule for missing items. Listing fields without a missing-value rule still yields inconsistent output when a contract lacks an item."},
306:{o:["Write a longer, more detailed list of style rules with dos and don'ts","Give two or three short examples of the style and ask Claude to match them","Describe the style in adjectives, such as “playful, punchy and slightly irreverent”","Ask Claude to study the company's website and work out the style from that"],e:"When a style is hard to put into rules, examples are the most effective way to show it. Adjectives and longer rule lists stay vague, and inferring style from a website is unreliable."},
307:{o:["Not enough detail was requested. Ask for more detail on each section","The prompt didn't say what the plan is for. State its decision and required fields","The plan is too long. Ask for half the length so the key points stand out","The model tier is too low for planning. Switch to a more capable model"],e:"The problem is missing purpose, not too little or too much length. Stating the decision the plan supports and the fields required focuses the output. A different model won't infer an unstated purpose."},
308:{o:["Ask Claude whether it is sure, and whether the claim is fully supported","Ask Claude for supporting quotes and a count of delivery mentions, then spot-check","Ask Claude to rate its confidence in the claim on a scale from one to ten","Ask Claude to rewrite the claim as “some customers” to make it safer"],e:"Asking for the evidence and a count, then spot-checking it against the source, tests the claim efficiently. Asking about confidence relies on Claude's self-assessment. Softening the wording hides the question instead of answering it."},
309:{o:["The agreement is probably missing a page, so request the full copy","A fabricated reference. Check the supported claim against the real agreement","A numbering mistake. Section 6.3 was probably meant, so correct the reference","Claude may have a newer version of the agreement, so ask the supplier"],e:"A citation to a section that doesn't exist is a fabricated reference. The claim it supports must be verified against the source. Assuming it is a typo and “fixing” it skips that verification."},
310:{o:["Use the stated total, since totals are usually calculated more carefully","Treat the contradiction as an error and recalculate from the source figures","Use the sum of the rows, since that is the arithmetic shown in the table","Ask Claude which figure is correct and use the one it confirms"],e:"An internal contradiction signals an error. Both numbers are suspect until recalculated from source. Picking one, or asking Claude to choose, skips verification."},
311:{o:["That the simplified version is shorter and easier to scan than the original","That every safety-critical step and warning is still present and correct","That the reading level suits new starters with no technical background","That the main steps are in the same order as in the original procedure"],e:"When simplifying safety content, the critical check is that no safety step or warning was lost or changed. Readability and order matter, but they come after completeness and correctness."},
312:{o:["Acceptable, since the content is accurate and the writing quality is high","Accurate but off-target. It fails on relevance and needs redirecting","Inaccurate, because it doesn't answer the question that was asked","A hallucination, because it contains content that wasn't requested"],e:"Accuracy and relevance are separate criteria. The response is accurate but off-target, so it fails on relevance. It isn't inaccurate or a hallucination."},
313:{o:["Trust the quote, since it came directly from the email they provided","Check the quote word for word against the original email","Ask Claude to confirm the quote is exact before sharing","Remove the quotation marks so it reads as a paraphrase"],e:"Direct quotes must be checked against the source. Claude can misquote even provided text, and asking Claude to confirm isn't verification. Removing quote marks hides the risk instead of checking it."},
314:{o:["After reading both responses, so the criteria fit what was actually produced","Before generating, so both are judged against the same standard","After generating but before reading, so the criteria can reflect the topic","Only if the two responses disagree, since otherwise either is acceptable"],e:"Criteria set before generating avoid being influenced by how persuasive each response reads. Setting them afterwards lets the outputs shape the standard."}

315:{o:["Regenerate the response until a correct answer appears, which replaces the wrong one","Use the thumbs-down feedback on the response to flag the problem","Edit the original prompt and resend it, which reports the earlier answer as wrong","Report it through the account's privacy settings page, which reviews incorrect answers"],e:"The thumbs-down feedback on a response is the built-in way to flag a problem. Regenerating or editing the prompt gets a new answer but doesn't report the bad one. Privacy settings are for data controls, not answer quality."},
316:{o:["That the file opens cleanly in a spreadsheet and every row has the same number of columns","That headers exactly match the CRM's field names and values follow its formats","That the headers look sensible and the first few rows contain realistic-looking values","That there are no duplicate rows, since the CRM will reject the file if any appear"],e:"An import succeeds only if headers match the target's required field names exactly and values follow its formats (dates, codes). A file that opens cleanly or looks sensible can still fail or import into the wrong fields."},
317:{o:["An internal summary of last quarter's sales figures for the leadership team meeting","A public web page explaining customers' legal rights to a refund","An internal FAQ for staff on how to process refunds in the billing system","A draft email to a key client apologizing for a delayed delivery"],e:"Public-facing statements of legal rights carry regulatory and legal risk, so they need qualified (legal or compliance) review. The others need ordinary review, but are internal or lower-stakes."},
318:{o:["Remove all interpretation so the summary contains only directly sourced facts","Ask Claude to separate cited findings from its interpretation and label each","Add a disclaimer at the end noting that the summary includes some interpretation","Ask Claude to add citations to every sentence, including the interpretive ones"],e:"Readers need to tell sourced findings from interpretation. Labeling each, with citations for the findings, does that. Removing interpretation loses value. A disclaimer or citing interpretive sentences still blurs the line."},
319:{o:["Send it to the customer as the decision, after checking it for tone and spelling","Use it as input for an authorized person, who reviews the case and owns the decision","Use it as the decision if a second team member agrees after reading the draft","Send it to the customer with a note that it was drafted with AI assistance"],e:"Decisions with significant impact on a person need an authorized human who reviews the case and owns the outcome. A colleague merely agreeing with the draft, or disclosing AI use, doesn't put a proper decision-maker in charge."},
320:{o:["A figure that doesn't match the source scorecard","A cited section of the contract that doesn't exist","A trend described as “sharp” where the source calls it “moderate”","A supplier ranked fourth instead of third because of rounding","A summary that omits a minor supplier with one late delivery"],e:"A wrong figure and a fabricated citation are clear factual errors that must be fixed. Wording strength, rounding-driven ranking and minor omissions may need attention, but they're judgment calls rather than definite errors."},
321:{o:["Keep last year's choice, since it worked and switching would need retraining","Re-test current models on a sample of today's work before deciding to switch","Switch to the newest version of the same tier, since newer versions are better","Re-test the current models using last year's test set, so the results are comparable"],e:"Re-testing on current work shows whether a newer model is better for what the team does now. Assuming newer is better skips evidence. Last year's test set may no longer reflect the work."},
322:{o:["A Project with last year's competitor reports as knowledge, developed as an artifact","Research to gather current cited sources, with the briefing developed as an artifact","Extended thinking to reason carefully about launches, then copy the answer into an email","Research to gather current sources, then copy the answer into an email for the team"],e:"Recent, sourced information needs the research capability. A briefing to be refined and shared fits an artifact. Old knowledge files are out of date, extended thinking doesn't fetch sources, and an email is hard to refine."},
323:{o:["Which tier gives the fastest responses, since speed affects how much the team uses it","The quality bar the output must meet, such as accuracy and acceptable error rate","The monthly budget, since cost determines which tiers are realistic for the team","The volume of requests, since high volumes always need the lightest tier"],e:"The quality bar comes first. You can't judge whether a tier is good enough, or cheap enough, until you know what “good enough” means. Speed, cost and volume are weighed against that bar."},
324:{o:["Yes. A Project keeps the ideas available if the team wants to revisit them later","No. A quick, disposable brainstorm is fine in an ordinary chat","Yes. An artifact makes the list easy to share with the organizers","No. Use extended thinking instead, so the ideas are more creative"],e:"Setup should match the task. A quick, disposable brainstorm doesn't need a Project or artifact. Sharing can be done by copying the list. Extended thinking isn't needed for simple ideation."},
325:{o:["Keep going, and restate the current goal at the top of each new message","Ask for a summary of decisions and current state, then continue in a new chat","Start a new chat and re-upload all the documents so Claude has full context","Switch to a more capable model so it can handle the longer conversation"],e:"Summarizing the key decisions and state, then continuing fresh, keeps what matters and drops the clutter. Re-uploading everything recreates the overload. A different model doesn't fix the bloated context."},
326:{o:["They trade off speed and cost against capability, but all three have the same context window","Haiku is fastest and lightest, Opus most capable, and Sonnet balances the two","Opus is the most capable, so it is the right choice whenever accuracy matters at all","Haiku is best for short tasks and Opus for long tasks, since capability depends on length"],e:"The families trade speed and cost against capability: Haiku lightest, Opus most capable, Sonnet in between. Many accuracy-sensitive tasks are handled well by lighter tiers, and capability isn't about task length."},
327:{o:["The most capable tier, since accuracy matters and 50,000 errors would be costly","The lightest tier, validated on a labeled sample to confirm it meets the bar","The lightest tier, since classification into clear categories is always simple","A mid tier with extended thinking, so each comment is considered carefully"],e:"High-volume, simple classification suits the lightest tier, but only once a labeled sample confirms it meets the agreed accuracy. Assuming it's fine without validation, or paying for more capability, are both weaker."},
328:{o:["Add a dropdown listing approved AI tools, so requests at least name a supported tool","Ask for the business outcome and problem first, then decide whether and how Claude fits","Ask for the problem, and require requesters to also name the tool they want to use","Add a field for expected time saved, so requests can be prioritized by benefit"],e:"Starting from the need and outcome avoids solution-first requests. Still asking requesters to name a tool keeps the bias. Expected time saved helps prioritization but doesn't fix the framing."},
329:{o:["Running a batch of typical requests to confirm the routing works under normal load","Testing edge cases, such as multi-department requests or missing information","Asking Claude to list the edge cases it expects to struggle with before launch","Running the most common request types and checking the time saved on each"],e:"Edge cases reveal where routing breaks. Typical requests mostly confirm what already works. Claude's own predictions aren't a test."},
330:{o:["Run a survey asking testers to rate the workflow's ease of use from one to ten","Ask for concrete examples of where it was clunky, then fix those points","Simplify the whole workflow by removing a step, since fewer steps feel smoother","Note the feedback and continue the pilot, then review all comments at the end"],e:"Vague feedback needs specifics. Concrete examples show exactly what to fix. A rating doesn't show where the problem is, and removing a step at random may break something that works."},
331:{o:["What changes and the expected time savings, so staff see the benefits clearly","What changes, what stays, which decisions stay with people, and how to raise concerns","What changes and the training schedule, so staff know when to learn the new steps","That the workflow is being piloted, so staff know it may change before final rollout"],e:"Clear communication covers what changes, what doesn't, where human judgment remains, and how to raise concerns. Benefits, training dates and pilot status are useful, but on their own they leave out the questions staff care most about."},
332:{o:["Yes, in phases: Claude takes the simplest tickets first and the team shrinks gradually","Pilot Claude drafting replies with agent review, measure against criteria, then decide","No. Claude can assist the team, but customer support needs people for every reply","Possibly. Run Claude alone on a sample of tickets for a week and compare satisfaction"],e:"An honest answer avoids promising replacement or ruling out help. A reviewed pilot measured against criteria gives evidence for the decision. Running Claude unsupervised on live tickets exposes customers to unreviewed answers."},
333:{o:["Different managers reviewed the reports each week, so standards varied","The Claude reports were the simpler ones, and rework time wasn't counted","The pilot ran for six weeks rather than eight, so the sample is small","The manual reports were written by more junior staff than the Claude ones"],e:"Easier tasks in the Claude group plus uncounted rework inflate the speed gain, which undermines the comparison most directly. The other issues weaken it less."},
334:{o:["Ask Claude to write and test the integration code, then hand it to IT to deploy","Route it to the technical team, describing the business need and required checks","Ask Claude to explain the integration options, then pick one and start building","Build a prototype in a test account first, then share it with the technical team"],e:"Custom integrations between business systems belong with the technical team. The associate's role is to describe the need and checks clearly. Writing or prototyping the code themselves goes beyond that role."},
335:{o:["Ask Claude to draft a faster process based on industry best practice","Map the current process and measure where time is lost","Interview approvers about what they would change in the process","Automate the slowest approval step first, since it is the bottleneck"],e:"You need to see and measure the current process before redesigning it. Best practice and interviews help, but without measurement you may fix the wrong step. Naming a bottleneck before measuring is a guess."},
336:{o:["Claude, after a self-check prompt that asks it to verify accuracy","The analyst, who reviews it for accuracy and owns what is sent","The meeting chair, who should approve all summaries before release","The attendees, who can each correct their own parts after it is sent"],e:"The person who checks the summary owns what is sent. Claude's self-check isn't accountable review. Adding the chair may help, but the analyst is the defined final check, and correcting after sending is too late."},
337:{o:["Measured results against a baseline, including time, quality and errors","A clear account of limitations and how they were handled","Detailed testimonials from users across every team in the pilot","A demonstration of the best outputs from the pilot period","Results from the strongest metrics, with a note that others are available"],e:"Measured results against a baseline and honest limitations build credibility. Testimonials and best-case demos are selective. Highlighting only the strongest metrics invites distrust."},
338:{o:["Add the abbreviations to the associate's account-wide profile preferences","Put a glossary in the client's Project knowledge, plus an instruction to use it","Add the glossary to the Project knowledge without any extra instruction","Explain the abbreviations at the start of each chat in the Project"],e:"Client-specific context belongs in that client's Project, and an instruction makes sure Claude uses it. Profile preferences apply to every chat. A glossary without an instruction may be missed. Per-chat explanations are fragile."},
339:{o:["Upload new versions whenever someone notices a change in the policy","Assign an owner to review on a set schedule, and keep a change log","Ask Claude to flag files that look outdated at the start of each chat","Add the date to each file name so users can see how old it is"],e:"An owner, a schedule and a change log stop knowledge going stale. Ad hoc updates, Claude's guesses and dated names all rely on someone noticing."},
340:{o:["Leave them connected, but tell Claude in each Project which one to use","Disconnect unused connectors to reduce unnecessary access","Leave them connected, since unused connectors don't access any data","Review them once a year and disconnect any that look unnecessary"],e:"Least privilege means removing access that isn't needed now. Instructions don't limit access. Waiting for an annual review leaves unneeded access in place in the meantime."},
341:{o:["Ask Claude to confirm it has read the new file before users rely on it","Tell the Project's users what changed and when it takes effect","Start a new chat to make sure Claude uses the new file going forward","Keep the old file too, so users can compare the two price lists"],e:"Users need to know what changed and when. Asking Claude or starting a new chat doesn't inform anyone. Keeping the old file risks Claude quoting outdated prices."},
342:{o:["Upload it with an instruction telling Claude to share salary data only with managers","Keep it out of the shared Project, or use a separate Project only managers can access","Upload it to the shared Project, but only after removing employees' names","Upload it with a note asking non-managers not to ask about salaries"],e:"Access should be controlled by who can see the Project, not by instructions or requests. Removing names may not be enough, since roles and teams can identify people."},
343:{o:["Upload a fresh copy of the spreadsheet each morning before writing the report","Use an approved connector so Claude reads the live spreadsheet","Paste the latest figures into the chat each time the report is written","Upload a copy once a week and note the date it was taken in the report"],e:"An approved connector reads live data, which is what a several-times-a-day spreadsheet needs. Daily uploads and pasting still go stale within hours and add manual effort."},
344:{o:["Add “use the most recent list” to the instructions, keeping both lists for reference","Remove the 2025 list from knowledge, and name the current file in the instructions","Rename the 2025 file “OLD_price_list” so Claude knows not to use it","Add a note at the top of the 2026 list saying it replaces the 2025 list"],e:"Removing the outdated list and naming the current file removes the ambiguity. Renaming, notes or a “most recent” rule leave the old prices available to be quoted."},
345:{o:["None, provided the data stays inside the approved Claude workspace","Approval for one purpose doesn't cover a new one. It needs its own policy and consent check","Only that the marketing team needs separate access to the workspace","None, provided names are removed before the marketing analysis"],e:"Purpose limitation means approval is tied to a purpose. A new use needs its own check against policy and consent. Staying in the workspace or removing names doesn't settle whether the new purpose is allowed."},
346:{o:["Yes, because temporary chats aren't used to train models, which removes the main risk","No. It depends on policy and the approved workspace, not on the chat mode","Yes, if the data is limited to what the task needs and deleted afterwards","No. Regulated data can never be used with Claude under any circumstances"],e:"Chat mode doesn't change data obligations. Policy and the approved workspace decide what's allowed. Training use is only one consideration, and approved workspaces can permit regulated data where policy allows."},
347:{o:["The firm's AI policy only, since the firm is responsible for the deliverable","The firm's AI policy and the client's terms on AI use, including disclosure","The client's terms only, since they are the ones receiving the work","Whether the deliverable passes an AI-detection tool before sending it"],e:"Both the firm's policy and the client's terms apply, including any disclosure requirements. AI-detection tools don't settle compliance."},
348:{o:["Detailed logging of every action so mistakes can be traced afterwards","Human approval before irreversible or high-impact actions","Clear written instructions describing which actions are allowed","A daily review of actions taken in the previous 24 hours"],e:"Approval before irreversible or high-impact actions prevents harm. Logging and daily reviews only catch problems after they happen. Instructions don't enforce limits."},
349:{o:["Use the personal account this once, then redo the work in the approved one","Use the approved workspace, since policy still applies under time pressure","Use the personal account, but avoid pasting any confidential information","Ask their manager for permission to use the personal account this time"],e:"Policy applies under deadlines too. Avoiding confidential data still breaks the rule, and a manager can't approve a personal-account exception to company policy."},
350:{o:["Drafting rejection emails that recruiters personalize and send themselves","Summarizing interview notes for the panel to discuss together","Rejecting applicants automatically based on Claude's screening, with no human review","Ranking applications for recruiters, who then review every candidate"],e:"Automated rejection with no human review is the least appropriate, because it makes consequential decisions about people without oversight. The others keep a person in charge of each decision."},
351:{o:["By the tool used, since outputs from more capable models need lighter review","In proportion to risk: light for low-stakes drafts, thorough for external or high-impact content","By the author's experience, since senior staff need less review of their outputs","The same thorough level for every output, since any output could contain errors"],e:"Review should scale with the stakes. Uniform heavy review wastes effort on trivial drafts. Model tier or author seniority doesn't change the risk of the content."},
352:{o:["It retrieves the most relevant passages from its training data and combines them","It predicts likely text from learned patterns, so it can be fluent but wrong","It reasons step by step from facts it has verified, then writes the answer","It predicts likely text, and flags low-confidence statements automatically"],e:"Claude generates text by predicting likely continuations from learned patterns. That is why it can be fluent and still wrong. It doesn't retrieve or verify facts by default, or automatically flag uncertainty."},
353:{o:["Confirm the survey's consent terms cover this kind of analysis","Remove names and contact details not needed for the analysis","Keep names but remove email addresses, since names alone aren't sensitive","Check consent after the analysis, before sharing any results","Add purchase history to make the analysis more useful for the business"],e:"Confirming consent covers the purpose, and removing unneeded identifiers, reflect consent and minimization. Names are still personal data. Checking consent after the use is too late. Adding data goes against minimization."},
354:{o:["Add “sort them carefully and consistently” to the end of the prompt","Specify the categories, the criteria for each, and the output format","List the categories to sort into, and leave the criteria to Claude","Ask Claude to explain how it sorted them, then correct the mistakes"],e:"Consistent sorting needs defined categories, criteria and format. Categories without criteria still leave Claude guessing at the boundaries. Correcting after the fact doesn't stop inconsistency."},
355:{o:["Add an instruction to say when sources don't cover it, and test with typical questions","Add an instruction to say when sources don't cover it, and test with out-of-scope questions","Upload more documents so the sources cover more questions, then test with typical ones","Ask users to check answers against the sources, so guesses are caught afterwards"],e:"The fix is an explicit instruction, and the test must use questions the sources deliberately don't cover. Testing with typical questions won't show whether the new behavior works."},
356:{o:["Move the format rule to the first paragraph, and keep the rest of the prompt as it is","Move format rules into a short list near the end of the request, with an example","Repeat the format rule in capital letters in paragraph six so it stands out","Keep the rule in paragraph six and ask Claude to read the whole prompt carefully"],e:"A short, clear list near the end, with an example of the output, makes format rules easy to follow. Moving one rule to the top helps a little, but without an example it can still be missed. Capitals and pleas are weak fixes."},
357:{o:["Add “include action owners” to the instructions, and check the next meeting's summary","Require owners in the Project instructions, then test on several past meetings","Ask Claude in each chat to list the action owners at the end of the summary","Add a template with an owners column, and trust that Claude will fill it in"],e:"Change the instructions, then test on several past meetings to confirm the fix works across cases. Checking one future meeting is a thin test, and per-chat asks or an untested template don't confirm anything."},
358:{o:["Context overflow. Delete the earliest messages so the latest decisions take priority","Context drift, or context rot. Summarize the agreed decisions and continue in a fresh chat","Hallucination. Ask Claude to check its answers against the earlier decisions","Context drift. Restate every earlier decision in each new message in the same chat"],e:"This is context drift (context rot). Summarizing agreed decisions and continuing fresh is the reliable fix. Restating everything in the same chat keeps adding to the bloat, and deleting messages can lose decisions."},
359:{o:["Specify a minimum length for each section, such as at least 300 words","Break the report into stages and specify what each section must cover","Provide a longer example report and ask Claude to match its level of detail","Ask Claude to list what is missing from the thin draft, then add it"],e:"Staging the work and defining required content per section addresses the cause. Length minimums add padding. An example helps with style, but not with what this report must cover. Claude's own gap list doesn't know what the reader needs."}

function loadTests(){try{const t=JSON.parse(localStorage.getItem(TKEY)||"{}");return t&&typeof t==="object"?t:{}}catch(e){return {}}}

/* ---------- building attempts ---------- */
function makeItems(idxs){return idxs.map(qi=>({qi,order:shuffle(BANK[qi].o.map((_,i)=>i)),sel:[],checked:false,flag:false}))}

const NSETS=7;
// Fixed papers: the k-th question of each domain goes to set floor(k / items-per-paper), so every set follows the blueprint exactly.
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seededShuffle(a,seed){const r=rng(seed);a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Fixed papers: in each domain, hard questions are dealt first, then web-topic questions, then the rest, round-robin across the sets,
// so every set has the exact blueprint count per domain and an even share of hard and new questions. Seeded, so sets never change between visits.
let SETS=null;
function buildSets(){SETS=Array.from({length:NSETS},()=>[]);DKEYS.forEach((d,di)=>{const ix=byDomain(d);
  const hard=seededShuffle(ix.filter(i=>BANK[i].h),11+di),nw=seededShuffle(ix.filter(i=>!BANK[i].h&&BANK[i].n),23+di),up=seededShuffle(ix.filter(i=>!BANK[i].h&&!BANK[i].n&&BANK[i].u),51+di),std=seededShuffle(ix.filter(i=>!BANK[i].h&&!BANK[i].n&&!BANK[i].u),37+di);
  [...hard,...nw,...up,...std].forEach((qi,k)=>SETS[(k+di)%NSETS].push(qi))})}
function setIdx(s){if(!SETS)buildSets();return SETS[s]}
function hardIdx(){const out=[];DKEYS.forEach(d=>out.push(...shuffle(byDomain(d).filter(i=>BANK[i].h)).slice(0,DOM[d].c)));return shuffle(out)}
function setName(s){return "Set "+(s+1)}
function bestFor(label,hist){const h=hist.filter(x=>x.label===label);return h.length?Math.max(...h.map(x=>x.sc)):null}
function start(kind,arg,fresh){

      cur:Math.min(saved.cur||0,saved.items.length-1),started:now-saved.used,paused:0,pausedAt:saved.timed?now:0,limit:saved.limit,confirm:false,done:false,resumed:true};

function elapsed(){return((S.pausedAt||Date.now())-S.started-S.paused)/1000}

function isRight(it){const q=BANK[it.qi];const a=ansSet(q);return it.sel.length===a.length&&a.every(x=>it.sel.includes(x))}

  clearInterval(window._tick);

function openSaved(k){const t=getTest(k);if(!t)return renderHome();
  if(t.state==="done"){lastResult=t.r;lastResult.key=k;reviewFilter=t.r.raw<t.r.total?"wrong":"all";renderResults();window.scrollTo(0,0);return}
  if(t.kind==="retry"){start("retry",null);return}
  start(t.kind,t.arg)}
function renderHome(){
  clearInterval(window._tick);S=null;
  const counts={};DKEYS.forEach(d=>counts[d]=byDomain(d).length);
  const hist=loadHist();
  const tests={};const all=loadTests();for(const k in all){const t=getTest(k);if(t)tests[k]=t}
  const savedKeys=Object.keys(tests).sort((a,b)=>tests[b].saved-tests[a].saved);
  app.innerHTML=`
  <div class="wrap">
    <header class="hero">
      <span class="eyebrow">Claude Certified Associate – Foundations</span>
      <h1>CCAO-F Mock Exam</h1>
      <p>${BANK.length} new scenario questions across all seven exam domains, scored the way the real exam reports results: a scaled score out of 1,000 with a pass mark of 720.</p>
    </header>

    <div class="spec">
      <div><b>60</b><span>questions per mock</span></div>
      <div><b>120</b><span>minutes, timed</span></div>
      <div><b>720</b><span>pass mark (100–1,000)</span></div>
      <div><b>${BANK.length}</b><span>questions in the bank</span></div>
    </div>

    <section style="margin-bottom:22px">
      <div class="section-h"><h2>Exam sets</h2><span class="eyebrow">${NSETS} fixed papers · no repeats between sets</span></div>
      <div class="sets">${Array.from({length:NSETS},(_,s)=>{const b=bestFor(setName(s),hist);const hc=setIdx(s).filter(i=>BANK[i].h).length;return `<button class="setcard" data-s="${s}">
        <span class="eyebrow">Set ${s+1}</span>
        <b>60 questions · 120 min</b><span style="font-size:12px;color:var(--muted)">includes ${hc} hard</span>
        <span class="best">${b===null?"Not attempted":`Best ${b} <span class="pill ${b>=PASS?"pass":"fail"}">${b>=PASS?"PASS":"FAIL"}</span>`}</span>
        ${statusLine(tests["set:"+s])}
      </button>`}).join("")}</div>
    </section>

    <div class="modes">
      <button class="mode lead" id="goExam">
        <span class="tag">60 Q · 120 MIN</span>
        <h3>Random mock exam</h3>
        <p>A new 60-question paper mixed from the whole bank, drawn to the official domain weights. Check each answer as you go to see if it's right and why, then submit for your scaled score.</p>
        ${statusLine(tests.exam)}<span class="btn primary" style="align-self:flex-start">${btnText(tests.exam,"Start exam")}</span>
      </button>
      <button class="mode" id="goHard">
        <span class="tag" style="color:var(--bad)">60 HARD Q · 120 MIN</span>
        <h3>Hard mock exam</h3>
        <p>Sixty questions drawn only from the hard pool, to the same domain weights. Use it as your final readiness check.</p>
        ${statusLine(tests.hard)}<span class="btn" style="align-self:flex-start">${btnText(tests.hard,"Start hard mock")}</span>
      </button>
      <button class="mode" id="goQuiz">
        <span class="tag">20 Q · 40 MIN</span>
        <h3>Quick quiz</h3>
        <p>Twenty random questions with instant feedback and explanations after each answer. Still scored out of 1,000.</p>
        ${statusLine(tests.quiz)}<span class="btn" style="align-self:flex-start">${btnText(tests.quiz,"Start quiz")}</span>
      </button>
      <div class="mode">
        <span class="tag">UNTIMED</span>
        <h3>Practice one domain</h3>
        <p>Work through every question in a domain with instant feedback.</p>
        <div class="domainpick">${DKEYS.map(d=>`<button class="dchip" data-d="${d}">${tests["domain:"+d]?`<span class="sdot ${tests["domain:"+d].state}"></span>`:""}${DOM[d].s} <span class="mono" style="opacity:.6">${counts[d]}</span></button>`).join("")}</div>
      </div>
    </div>

    ${savedKeys.length?`<section style="margin-bottom:22px">
      <div class="section-h"><h2>Saved tests</h2><span class="eyebrow">kept in this browser until you reset</span></div>
      <div class="panel savedlist">${savedKeys.map(k=>{const t=tests[k];const done=t.state==="done";return `<div class="srow">
        <div class="sinfo"><b>${esc(t.label)}</b><span>${done?`Finished · ${t.r.sc} <span class="pill ${t.r.pass?"pass":"fail"}">${t.r.pass?"PASS":"FAIL"}</span> · ${t.r.raw}/${t.r.total} correct`:inProg(t)}</span></div>
        <div class="sbtns"><button class="btn" data-open="${esc(k)}">${done?"Review":"Resume"}</button><button class="btn ghost" data-reset="${esc(k)}">Reset</button></div>
      </div>`}).join("")}</div>
    </section>`:""}

    <div class="grid2">
      <section>
        <div class="section-h"><h2>Exam blueprint</h2><span class="eyebrow">weight → items</span></div>
        <div class="panel tablewrap"><table>
          <thead><tr><th>Domain</th><th class="num">Weight</th><th class="num">Items</th></tr></thead>
          <tbody>${DKEYS.map((d,i)=>`<tr><td>${i+1}. ${DOM[d].n}</td><td class="num">${DOM[d].w}%</td><td class="num">${DOM[d].c}</td></tr>`).join("")}
          <tr><td><b>Total</b></td><td class="num"><b>100%</b></td><td class="num"><b>60</b></td></tr></tbody>
        </table></div>
      </section>
      <section>
        <div class="section-h"><h2>Your attempts</h2>${hist.length?`<button class="btn ghost" id="clearH">Clear</button>`:""}</div>
        <div class="panel tablewrap">${hist.length?`<table>
          <thead><tr><th>Date</th><th>Mode</th><th class="num">Score</th><th></th></tr></thead>
          <tbody>${hist.slice(0,8).map(h=>`<tr><td>${new Date(h.t).toLocaleDateString(undefined,{day:"numeric",month:"short"})}</td><td>${esc(h.label)}</td><td class="num">${h.sc}</td><td><span class="pill ${h.pass?"pass":"fail"}">${h.pass?"PASS":"FAIL"}</span></td></tr>`).join("")}</tbody>
        </table>`:`<div class="empty">Your scores appear here after each mock exam or quick quiz. They are saved in this browser only.</div>`}</div>
      </section>
    </div>

    <div class="notes">
      <b style="color:var(--ink)">How this mock is scored</b>
      <ul>
        <li>Every question is worth one mark. “Select TWO” questions score only if both choices are right, with no partial credit.</li>
        <li>Raw marks are converted to the 100–1,000 scale in a straight line (scaled = 100 + 900 × marks ÷ questions). Anthropic doesn't publish its real conversion, so this is an estimate. On a 60-question paper, 720 works out to about 42 correct (69%).</li>
        <li>Aim for 75% or better in every domain. The domain chart on the results page marks that target.</li>
        <li>Exam format (60 items, 120 minutes, 720 to pass, domain weights) comes from your CCAO-F flashcards and the practice question set, both based on Exam Guide v1.0, and matches public prep sites. All questions here are newly written and are not real exam content. Sixty of them cover topics seen in free public practice material (Open Exam Prep, TimoLabs, CertSafari, StudyTech), rewritten in original wording. Another sixty cover topics from your uploaded practice exam that the bank didn't already cover (knowledge cutoff, choosing the right tool, data masking, memory and Research), rewritten with harder answer options. Everything stays within the exam guide's seven domains for business users of Claude. Developer topics such as the API, Claude Code and app add-ins are left out.</li>
      </ul>
    </div>
  </div>`;
  document.getElementById("goExam").onclick=()=>start("exam");
  app.querySelectorAll(".setcard").forEach(b=>b.onclick=()=>start("set",+b.dataset.s));
  document.getElementById("goQuiz").onclick=()=>start("quiz");
  document.getElementById("goHard").onclick=()=>start("hard");
  app.querySelectorAll(".dchip").forEach(b=>b.onclick=e=>{e.stopPropagation();start("domain",b.dataset.d)});
  const c=document.getElementById("clearH");if(c)c.onclick=()=>{saveHist([]);renderHome()};
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSaved(b.dataset.open));
  app.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{const k=b.dataset.reset;if(b.dataset.arm){resetTest(k);renderHome()}else{b.dataset.arm=1;b.textContent="Tap again to reset";setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent="Reset"}},2500)}});
}

/* ---------- exam ---------- */
function renderExam(){
  const it=S.items[S.cur], q=BANK[it.qi], n=need(q), total=S.items.length;
  const answered=S.items.filter(x=>x.sel.length).length;
  const locked=S.instant&&it.checked;
  const ans=ansSet(q);
  const optHtml=it.order.map((oi,pos)=>{
    let cls="opt"+(n>1?" multi":"");
    const chosen=it.sel.includes(oi);
    if(locked){ if(ans.includes(oi))cls+=" right"; else if(chosen)cls+=" wrong"; }
    else if(chosen)cls+=" sel";
    return `<button class="${cls}" data-oi="${oi}" ${locked?"disabled":""} aria-pressed="${chosen}"><span class="k">${LET[pos]}</span><span class="t">${esc(q.o[oi])}</span></button>`;
  }).join("");
  let feedback="";
  if(locked){
    const ok=isRight(it);
    feedback=`<div class="explain ${ok?"ok":"no"}"><b>${ok?"Correct":"Not quite"}</b>${esc(q.e)}</div>`;
  }
  const navCls=(x,i)=>{let c="nb";if(S.instant&&x.checked)c+=isRight(x)?" ok":" no";else if(x.sel.length)c+=" ans";if(x.flag)c+=" fl";if(i===S.cur)c+=" cur";return c};
  const unanswered=total-answered, flagged=S.items.filter(x=>x.flag).length;
  const isLast=S.cur===total-1;
  const isExam=["exam","set","hard"].includes(S.kind);
  let primary;
  if(S.instant&&!it.checked) primary=`<button class="btn primary" id="check" ${it.sel.length===n?"":"disabled"}>Check answer</button>`;
  else primary=`<button class="btn primary" id="next" ${isLast?"disabled":""}>Next</button>`;

  app.innerHTML=`
  <div class="strip"><div class="in">
    <button class="btn ghost" id="quit" title="Your progress is saved. Reopen this test to continue.">✕ Exit</button>
    <span class="title">${esc(S.label)}</span>
    <span class="mono" style="color:var(--muted);font-size:13px">${answered}/${total}<span class="answord"> answered</span></span>
    ${S.timed?`<span class="timer" id="timer">${fmt(remaining())}</span><button class="btn pausebtn" title="${S.pausedAt?"Resume timer (P)":"Pause timer (P)"}" id="pause" aria-label="${S.pausedAt?"Resume timer":"Pause timer"}">${S.pausedAt?"▶":"❚❚"}</button>`:""}
  </div><div class="progress"><i style="width:${answered/total*100}%"></i></div></div>
  <div class="wrap" style="padding-top:0">
    <div class="qhead"><span class="qnum">QUESTION ${S.cur+1} OF ${total}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${q.h?`<span class="htag">Hard</span>`:""}<span class="dtag">${DOM[q.d].n}</span></span></div>
    <div class="panel qcard">
      <div class="qtext">${esc(q.q)}</div>
      ${q.s?`<ol class="steps">${q.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
      ${n>1?`<span class="selectn">Select ${n===2?"TWO":n} answers</span>`:""}
      <div class="opts">${optHtml}</div>
      ${feedback}
    </div>
    <div class="controls">
      <button class="btn" id="prev" ${S.cur===0?"disabled":""}>Previous</button>
      ${primary}
    </div>
    <div class="controls">
      <button class="btn flagbtn ${it.flag?"on":""}" id="flag">${it.flag?"Flagged":"Flag for review"}</button>
    </div>
    <div class="panel nav">
      <div class="section-h" style="margin:0"><span class="eyebrow">Question navigator</span>
        <span class="legend"><span><i style="background:var(--accent-soft);border-color:var(--accent)"></i>answered</span><span><i style="background:var(--flag);border-color:var(--flag)"></i>flagged</span>${S.instant?`<span><i style="background:var(--good-soft);border-color:var(--good)"></i>right</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>wrong</span>`:""}</span></div>
      <div class="navgrid">${S.items.map((x,i)=>`<button class="${navCls(x,i)}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`).join("")}</div>
    </div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:14px">Keyboard: A–E to choose, ← → to move, F to flag${S.timed?", P to pause":""}${S.instant?", Enter to check":""}.</p>
    <div class="finishbar">
      <span>${isExam?"Finished the exam?":"Finished practising?"} ${answered}/${total} answered${flagged?`, ${flagged} flagged`:""}.</span>
      <button class="btn" id="submit">${isExam?"Submit exam":"See results"}</button>
    </div>
    ${S.confirm?`<div class="confirm">
      <p><b>${isExam?"Submit your exam?":"Finish and see your results?"}</b> ${unanswered?`You have <b>${unanswered}</b> unanswered question${unanswered>1?"s":""}, which will score zero.`:"All questions are answered."}${flagged?` ${flagged} question${flagged>1?"s are":" is"} flagged for review.`:""}</p>
      <div class="grp" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="yes">Submit and see score</button><button class="btn" id="no">Keep working</button></div>
    </div>`:""}
  </div>`;
  if(S.pausedAt){const w=app.querySelector(".wrap");w.innerHTML=`<div class="panel pausecard"><h2>${S.resumed?"Welcome back":"Paused"}</h2><p>${S.resumed?"Your answers were saved. ":""}The timer is stopped at ${fmt(remaining())}. The question is hidden until you resume.</p><button class="btn primary" id="resume">▶ Resume</button></div>`}

  persist();
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.oi));
  app.querySelectorAll(".nb").forEach(b=>b.onclick=()=>go(+b.dataset.i));
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f};
  on("pause",togglePause);on("resume",togglePause);
  on("prev",()=>go(S.cur-1));
  on("next",()=>go(S.cur+1));
  on("flag",()=>{it.flag=!it.flag;renderExam()});
  on("check",check);
  on("submit",()=>{{S.confirm=true;renderExam();const c=app.querySelector(".confirm");if(c)c.scrollIntoView({block:"center",behavior:"smooth"})}});
  on("yes",()=>finish(false));
  on("no",()=>{S.confirm=false;renderExam()});
  on("quit",()=>{if(S.timed&&!S.pausedAt)S.pausedAt=Date.now();persist();renderHome()});
}
function choose(oi){
  const it=S.items[S.cur],q=BANK[it.qi],n=need(q);
  if(S.instant&&it.checked)return;
  if(n===1){it.sel=[oi]}
  else{ if(it.sel.includes(oi))it.sel=it.sel.filter(x=>x!==oi); else{ if(it.sel.length>=n)it.sel.shift(); it.sel.push(oi);} }
  renderExam();
}
function check(){const it=S.items[S.cur];if(it.sel.length!==need(BANK[it.qi]))return;it.checked=true;renderExam()}
function go(i){if(i<0||i>=S.items.length)return;S.cur=i;S.confirm=false;renderExam();window.scrollTo({top:0})}

document.addEventListener("keydown",e=>{
  if(!S||S.done||e.metaKey||e.ctrlKey||e.altKey)return;
  if(S.pausedAt){if(e.key===" "||e.key==="Enter"||e.key.toUpperCase()==="P"){e.preventDefault();togglePause()}return}
  if(S.timed&&e.key.toUpperCase()==="P"){togglePause();return}
  const k=e.key.toUpperCase();
  const it=S.items[S.cur];
  const pos=LET.indexOf(k);
  if(pos>=0&&k.length===1&&pos<it.order.length){choose(it.order[pos]);return}
  if(e.key==="ArrowRight")go(S.cur+1);
  else if(e.key==="ArrowLeft")go(S.cur-1);
  else if(k==="F"){it.flag=!it.flag;renderExam()}
  else if(e.key==="Enter"&&S.instant&&!it.checked){e.preventDefault();check()}
});

/* ---------- results ---------- */
function renderResults(){
  const R=lastResult;
  const pct=Math.round(R.raw/R.total*100);
  const needed=Math.ceil((PASS-100)/900*R.total);
  const gaugePos=v=>((v-100)/900*100).toFixed(1)+"%";
  const wrongIdx=R.items.map((x,i)=>isRight(x)?-1:i).filter(i=>i>=0);
  const flagged=R.items.map((x,i)=>x.flag?i:-1).filter(i=>i>=0);
  const list=reviewFilter==="wrong"?wrongIdx:reviewFilter==="flag"?flagged:R.items.map((_,i)=>i);
  const domRows=DKEYS.filter(d=>R.per[d].t).map(d=>{
    const p=R.per[d], v=Math.round(p.r/p.t*100);
    const col=v>=75?"var(--good)":v>=60?"var(--flag)":"var(--bad)";
    return `<tr><td>${DOM[d].n}</td><td class="num">${p.r}/${p.t}</td><td class="num">${v}%</td><td style="width:34%"><div class="dbar"><i style="width:${v}%;background:${col}"></i><span class="tgt" title="75% target"></span></div></td></tr>`;
  }).join("");
  const weakest=DKEYS.filter(d=>R.per[d].t).sort((a,b)=>R.per[a].r/R.per[a].t-R.per[b].r/R.per[b].t)[0];

  const review=list.length?list.map(i=>{
    const it=R.items[i],q=BANK[it.qi],a=ansSet(q),ok=isRight(it);
    const opts=it.order.map((oi,pos)=>{
      const chosen=it.sel.includes(oi);let cls="opt"+(need(q)>1?" multi":"");
      if(a.includes(oi))cls+=" right";else if(chosen)cls+=" wrong";
      return `<div class="${cls}"><span class="k">${LET[pos]}</span><span class="t">${esc(q.o[oi])}${chosen?`<span class="mine" style="color:${a.includes(oi)?"var(--good)":"var(--bad)"}">your answer</span>`:""}</span></div>`;
    }).join("");
    return `<article class="panel rv">
      <div class="meta"><span class="qnum">Q${i+1}</span>${q.h?`<span class="htag">Hard</span>`:""}<span class="dtag">${DOM[q.d].s}</span><span class="pill ${ok?"pass":"fail"}">${ok?"CORRECT":it.sel.length?"INCORRECT":"NOT ANSWERED"}</span>${it.flag?`<span class="pill" style="background:var(--flag-soft);color:var(--flag)">FLAGGED</span>`:""}</div>
      <div class="qtext" style="font-size:15.5px">${esc(q.q)}</div>
      ${q.s?`<ol class="steps">${q.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:""}
      <div class="opts">${opts}</div>
      <div class="explain"><b>Why</b>${esc(q.e)}</div>
    </article>`;
  }).join(""):`<div class="panel empty">${reviewFilter==="wrong"?"No incorrect answers. Nice work.":reviewFilter==="flag"?"You didn't flag any questions.":"Nothing to show."}</div>`;

  app.innerHTML=`
  <div class="wrap">
    <div class="section-h" style="margin-bottom:14px"><span class="eyebrow">${esc(R.label)} · results${R.key?` · saved until you reset`:""}</span><button class="btn ghost" id="home">Back to start</button></div>
    <section class="panel score">
      <div><div class="big">${R.sc}<small> / 1000</small></div></div>
      <div style="min-width:0">
        <div class="verdict ${R.pass?"pass":"fail"}">${R.pass?"Pass":"Not yet a pass"}</div>
        <div style="color:var(--muted);font-size:14px">${R.pass?`You cleared the 720 pass mark by ${R.sc-PASS} points.`:`You need ${PASS-R.sc} more points, about ${Math.max(1,needed-R.raw)} more correct answer${needed-R.raw>1?"s":""}.`}${R.timeUp?" Time ran out, so the exam was submitted automatically.":""}</div>
        <div class="gauge"><i style="width:${gaugePos(R.sc)};background:${R.pass?"var(--good)":"var(--bad)"}"></i><span class="mark" style="left:${gaugePos(PASS)}"></span><span class="lbl" style="left:${gaugePos(PASS)}">pass 720</span></div>
        <div class="facts">
          <div><b>${R.raw}/${R.total}</b>marks</div>
          <div><b>${pct}%</b>correct</div>
          <div><b>${needed}</b>needed to pass</div>
          ${R.used&&isFinite(R.used)?`<div><b>${fmt(R.used)}</b>time used</div>`:""}
        </div>
      </div>
    </section>

    <section style="margin-top:22px">
      <div class="section-h"><h2>Score by domain</h2><span class="eyebrow">line marks the 75% target</span></div>
      <div class="panel tablewrap"><table>
        <thead><tr><th>Domain</th><th class="num">Marks</th><th class="num">Score</th><th></th></tr></thead>
        <tbody>${domRows}</tbody>
      </table></div>
      ${weakest&&R.per[weakest].r<R.per[weakest].t?`<p style="font-size:14px;color:var(--muted);margin:10px 0 0">Weakest area: <b style="color:var(--ink)">${DOM[weakest].n}</b>. <button class="btn ghost" style="padding:0" id="drill">Practice this domain</button></p>`:""}
    </section>

    <div class="controls" style="margin-top:18px">
      <div class="grp">
        <button class="btn primary" id="again">Reset &amp; retake</button>
        ${wrongIdx.length?`<button class="btn" id="retry">Retry ${wrongIdx.length} missed</button>`:""}
      </div>
    </div>

    <section style="margin-top:26px">
      <div class="section-h"><h2>Review answers</h2>
        <div class="filters">
          <button class="fchip ${reviewFilter==="wrong"?"on":""}" data-f="wrong">Incorrect ${wrongIdx.length}</button>
          <button class="fchip ${reviewFilter==="flag"?"on":""}" data-f="flag">Flagged ${flagged.length}</button>
          <button class="fchip ${reviewFilter==="all"?"on":""}" data-f="all">All ${R.total}</button>
        </div>
      </div>
      <div class="rlist">${review}</div>
    </section>
  </div>`;
  document.getElementById("home").onclick=renderHome;
  document.getElementById("again").onclick=()=>{
    if(R.kind==="exam"||R.kind==="quiz"||R.kind==="hard")start(R.kind,undefined,true);
    else if(R.kind==="set")start("set",R.arg!=null?R.arg:parseInt(R.label.slice(4))-1,true);
    else if(R.kind==="domain")start("domain",R.arg||BANK[R.items[0].qi].d,true);
    else start("retry",R.items.map(x=>x.qi),true);
  };
  const r=document.getElementById("retry");if(r)r.onclick=()=>start("retry",wrongIdx.map(i=>R.items[i].qi),true);
  const dr=document.getElementById("drill");if(dr)dr.onclick=()=>start("domain",weakest);
  app.querySelectorAll(".fchip").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.f;renderResults()});
}

renderHome();
</script>


</body>
</html>
